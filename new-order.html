<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faster - New Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: 'var(--bg-main)',
                        headerBg: 'var(--header-bg)',
                        chatBgColor: 'var(--chat-bg-color)',
                        primaryBtn: 'var(--primary-btn)',
                        textMain: 'var(--text-main)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        /* =========================================================
           1. CSS VARIABLES (ROOT)
           =========================================================
           Yahan saare main colors define kiye gaye hain. 
           Agar aapko text ya background colors change karne hon, 
           to sirf yahan color code badlein. Pura page update ho jayega!
        ========================================================= */
        :root {
            --bg-main: #f3f4f6;          /* App ka main background (Light Gray) */
            --header-bg: #ffffff;        /* Top Header (AppBar) ka color (White) */
            --chat-bg-color: #e5ddd5;    /* Chat area ka background (WhatsApp style) */
            
            --primary-btn: #ea580c;      /* Send / Confirm Button ka color (Orange) */
            --primary-btn-hover: #c2410c;/* Button par click/hover karne ka color */
            --text-main: #1f2937;        /* Main text ka color (Dark Gray) */
            
            --msg-user-bg: #dcf8c6;      /* User ke bheje hue message ka bubble color */
            --msg-bot-bg: #ffffff;       /* AI (Bot) ke message ka bubble color */
        }

        /* Strict Layout Settings */
        html, body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100%;
            height: 100vh;
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            margin: 0; 
            background-color: var(--bg-main); 
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .chat-bg { 
            background-color: var(--chat-bg-color); 
            /* Agar chat background me pattern image lagani ho to niche wali line use karein */
            /* background-image: url('YOUR_IMAGE_URL'); */
            background-size: cover;
            background-position: center;
        }

        /* Header Hide/Show Animation */
        #appHeader {
            transition: transform 0.3s ease-in-out;
            z-index: 50;
        }

        /* Message Bubbles Styling */
        .msg-user { background-color: var(--msg-user-bg); border-radius: 12px 0px 12px 12px; }
        .msg-bot { background-color: var(--msg-bot-bg); border-radius: 0px 12px 12px 12px; }
        
        /* Scrollbar Hide (Taake clean look aaye) */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="relative flex flex-col h-full w-full max-w-md mx-auto shadow-lg bg-themeBg">

    <header id="appHeader" class="absolute top-0 w-full bg-headerBg shadow-sm h-12 flex items-center justify-between px-4">
        <button onclick="window.history.back()" class="text-textMain hover:opacity-70">
            <i class="fas fa-arrow-left text-lg"></i>
        </button>
        
        <h1 class="text-textMain text-sm font-bold flex-1 text-center">
            Please Enter order Details
        </h1>
        
        <div class="w-5"></div>
    </header>

    <main id="chatContainer" class="flex-1 chat-bg overflow-y-auto mt-12 mb-32 p-4 flex flex-col gap-3">
        
        <div class="self-start max-w-[85%] msg-bot shadow-sm p-3 text-sm text-gray-800">
            Assalam o Alaikum! Mujhe order details likh kar, bol kar ya tasveer bhej kar batayein.
            <div class="text-[10px] text-gray-400 mt-1 text-right">Bot</div>
        </div>

    </main>

    <div class="absolute bottom-0 w-full bg-themeBg border-t border-gray-200 flex flex-col px-3 py-2 z-50">
        
        <div class="flex items-center gap-2 mb-2">
            <button class="text-gray-500 text-xl p-2 hover:bg-gray-200 rounded-full transition">
                <i class="fas fa-plus"></i>
            </button>
            
            <div class="flex-1 bg-white rounded-full flex items-center px-4 py-2 shadow-sm border border-gray-300">
                <input type="text" id="messageInput" placeholder="Message..." class="flex-1 bg-transparent outline-none text-sm text-gray-800">
                <button class="text-gray-500 ml-2 text-lg"><i class="fas fa-camera"></i></button>
            </div>

            <button onclick="sendMessage()" class="bg-[var(--primary-btn)] text-white h-10 w-10 rounded-full flex items-center justify-center shadow-md hover:bg-[var(--primary-btn-hover)] transition">
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </div>

        <button id="confirmBtn" onclick="confirmOrder()" class="w-full bg-[var(--primary-btn)] text-white font-bold text-sm py-3 rounded-lg shadow-md flex items-center justify-center gap-2 hover:bg-[var(--primary-btn-hover)] transition">
            Confirm order <i class="fas fa-check-circle text-white opacity-90 text-lg"></i>
        </button>
        
    </div>

    <script>
        // --- A. APPBAR SCROLL HIDE/SHOW LOGIC ---
        const chatContainer = document.getElementById('chatContainer');
        const header = document.getElementById('appHeader');
        let lastScrollTop = 0;

        chatContainer.addEventListener('scroll', function() {
            let currentScroll = chatContainer.scrollTop;
            
            // Agar user chat history padhne ke liye upar scroll kare (Scroll down the page)
            if (currentScroll > lastScrollTop && currentScroll > 20) {
                // Header ko upar ki taraf slide kar ke chupa do
                header.style.transform = 'translateY(-100%)';
            } else {
                // Wapas niche aane par Header dikha do
                header.style.transform = 'translateY(0)';
            }
            lastScrollTop = currentScroll;
        });

        // --- B. CONFIRM ORDER & REDIRECT LOGIC ---
        function confirmOrder() {
            // Yahan hum chat ki history aur basic details jama kar rahe hain
            const orderData = {
                status: 'confirm_pending',
                history: chatHistory, // Sari AI aur user ki baatein
                timestamp: new Date().getTime()
            };

            // Data ko browser ki memory (localStorage) me save kar rahe hain taake overview.html isay access kar sake
            localStorage.setItem('fasterOrderData', JSON.stringify(orderData));

            // overview.html wale page par bhej do
            window.location.href = 'overview.html';
        }

        // --- C. CHAT & AI LOGIC (FUTURE PLACEHOLDERS) ---
        let chatHistory = []; // Isme AI aur user ki baatein save hongi

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const userText = input.value.trim();

            if(userText === "") return;

            // 1. User ka message screen par dikhao
            renderMessage('user', userText);
            input.value = ''; // Input box khali karo

            // 2. Chat history array me user ka message add karo (AI ko context dene ke liye)
            chatHistory.push({ role: 'user', content: userText });

            // ---> [FUTURE AI INTEGRATION: JAB AAP API LAGAYENGE TO YE CODE UNCOMMENT HOGA] <---
            /*
            // Loading ya typing indicator dikhayein yahan...
            
            fetch('https://YOUR_SUPABASE_PROJECT.functions.supabase.co/chat-brain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText, history: chatHistory })
            })
            .then(res => res.json())
            .then(data => {
                const aiReply = data.reply;
                
                // Bot ka reply screen par dikhao
                renderMessage('bot', aiReply);
                
                // Bot ka reply history mein save karo
                chatHistory.push({ role: 'model', content: aiReply });
            })
            .catch(err => console.error("AI Error:", err));
            */
        }

        // UI me naya message lagane wala helper function
        function renderMessage(sender, text) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const isUser = sender === 'user';
            
            const msgDiv = document.createElement('div');
            // CSS Variables automatically colors utha lenge
            msgDiv.className = isUser 
                ? `self-end max-w-[85%] msg-user shadow-sm p-3 text-sm text-gray-800`
                : `self-start max-w-[85%] msg-bot shadow-sm p-3 text-sm text-gray-800`;
            
            msgDiv.innerHTML = `
                ${text}
                <div class="text-[10px] text-gray-500 mt-1 ${isUser ? 'text-right' : 'text-left'}">
                    ${timeStr} ${isUser ? '<i class="fas fa-check text-gray-400 ml-1"></i>' : ''}
                </div>
            `;
            
            chatContainer.appendChild(msgDiv);
            
            // Naya message aane par automatically bottom par scroll karna
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
