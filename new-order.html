<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faster - New Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: 'var(--bg-main)',
                        primaryBtn: 'var(--primary-btn)',
                        primaryBtnHover: 'var(--primary-btn-hover)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            --bg-main: #f3f4f6;             
            --header-bg: #0077b9;           /* Aapka custom blue color */
            --header-text: white;         
            
            --chat-bg-color: #e5ddd5;       
            --chat-bg-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            
            --primary-btn: #0077b9;         
            --primary-btn-hover: #005a8c;   
            
            --user-bubble: #dcf8c6;         
            --selection-bg: rgba(0, 119, 185, 0.9); /* Long press pe top bar ka color */
        }

        html, body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100%; height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; 
            overflow: hidden; margin: 0; 
            background-color: var(--chat-bg-color); 
            background-image: var(--chat-bg-image); 
            background-attachment: fixed;
            background-size: cover;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .chat-bg { 
            background: transparent; 
            flex: 1; overflow-y: auto; padding: 60px 16px 16px 16px; 
            display: flex; flex-direction: column; gap: 8px; 
            scroll-behavior: smooth;
        }

        /* Menu Styling */
        #attachMenu { 
            position: fixed; bottom: 75px; left: 16px; background: white; 
            border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            padding: 20px; width: 280px; z-index: 9999; 
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform: scale(0); transform-origin: bottom left; 
            opacity: 0; pointer-events: none;
        }
        #attachMenu.active { transform: scale(1); opacity: 1; pointer-events: auto; }

        /* Bubbles */
        .bubble { 
            max-width: 82%; padding: 8px 10px; border-radius: 12px; 
            font-size: 14.5px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
            word-wrap: break-word; position: relative; transition: all 0.2s ease; 
            user-select: none; -webkit-user-select: none; line-height: 1.4;
        }
        .customer-bubble { align-self: flex-end; background-color: var(--user-bubble); border-top-right-radius: 4px; }
        .ai-bubble { align-self: flex-start; background-color: white; border-top-left-radius: 4px; }
        /* 🔥 NEW: Selection (Long Press) Styling WhatsApp style */
        .bubble-selected { 
            background-color: rgba(0, 119, 185, 0.2) !important;
        }
        .bubble-selected::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; left: -24px; top: 50%; transform: translateY(-50%); 
            color: white; background: var(--primary-btn); border-radius: 50%; 
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 10px; box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .media-thumb { width: 100%; max-width: 250px; max-height: 250px; border-radius: 12px; object-fit: cover; background-color: rgba(0,0,0,0.05); cursor: pointer;}
        .caption-text { font-size: 13px; color: #1f2937; margin-top: 6px; padding-top: 4px; }
        
        .animate-pop { animation: pop 0.2s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        textarea::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #appHeader { transition: transform 0.3s ease-in-out; }
        
        /* 🔥 NEW: Zoom Overlay */
        .zoom-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 200000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .zoom-overlay.active { opacity: 1; pointer-events: auto; }
        #zoomImage {
            max-width: 100%; max-height: 100%; transition: transform 0.1s ease-out; transform-origin: center center;
        }

    </style>
</head>
<body>

    <header id="appHeader" class="fixed top-0 w-full bg-[var(--header-bg)] shadow-sm h-12 flex items-center justify-between px-4 z-[100]">
        <button onclick="window.history.back()" class="text-[var(--header-text)] hover:opacity-70">
            <i class="fas fa-arrow-left text-lg"></i>
        </button>
        <h1 class="text-[var(--header-text)] text-sm font-bold flex-1 text-center">
            Please Enter order Details
        </h1>
        <div class="w-5"></div>
    </header>

    <header id="selectionHeader" class="fixed top-0 w-full hidden bg-[var(--selection-bg)] h-12 text-white items-center shadow-md z-[110] px-4 justify-between transition-all">
        <div class="flex items-center gap-4">
            <button onclick="clearSelection()" class="text-xl active:scale-90"><i class="fas fa-arrow-left"></i></button>
            <span id="selectionCount" class="font-bold text-lg">1</span>
        </div>
        <button onclick="deleteSelectedItems()" class="text-xl active:scale-90"><i class="fas fa-trash"></i></button>
    </header>

    <div id="chatArea" class="chat-bg relative">
        <div id="emptyPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
            <span class="text-lg font-black uppercase tracking-[0.3em] text-gray-500">( Empty )</span>
        </div>
    </div>

    <div id="confirmBtnRow" class="hidden px-4 pt-2 pb-0 bg-transparent shrink-0 z-40 flex justify-center">
        <button onclick="goToOverview()" id="finalSubmitBtn" class="w-2/3 mx-auto bg-[var(--primary-btn)] hover:bg-[var(--primary-btn-hover)] text-white font-bold py-2 rounded-xl shadow-sm uppercase text-xs tracking-wide flex items-center justify-center gap-2 transition-colors">
            Confirm order <i class="fas fa-arrow-right text-[var(--primary-btn)] bg-white rounded-full text-sm p-1"></i>
        </button>
    </div>

    <footer id="mainFooter" class="bg-transparent px-2.5 pt-1 pb-safe flex items-end gap-2 shrink-0 z-50 transition-all relative">
        <div id="recordingBadge" class="hidden absolute -top-12 right-4 bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2 shadow-md animate-pulse">
            <span class="w-2 h-2 bg-white rounded-full"></span> Recording...
        </div>
        <button onclick="toggleAttachMenu()" id="plusBtn" class="w-11 h-11 flex items-center justify-center rounded-full bg-white text-gray-500 shadow-sm shrink-0 active:bg-gray-200 transition-colors">
            <i class="fas fa-plus transition-transform duration-300 text-lg" id="plusIcon"></i>
        </button>
        
        <div id="textInputWrapper" class="flex-1 bg-white rounded-3xl flex items-center px-4 shadow-sm">
            <textarea id="orderInput" oninput="handleInput(this)" placeholder="Type order details..." rows="1" class="w-full bg-transparent py-3 outline-none text-sm resize-none max-h-32 text-gray-800"></textarea>
        </div>

        <button id="sendBtn" onclick="addToDraft('text')" class="hidden w-11 h-11 bg-[var(--primary-btn)] text-white rounded-full flex items-center justify-center shadow-md shrink-0 active:scale-95 transition-transform">
            <i class="fas fa-paper-plane text-sm ml-0.5"></i>
        </button>
        <button id="voiceBtn" class="w-11 h-11 bg-green-500 text-white rounded-full flex items-center justify-center shadow-md shrink-0 active:scale-95 transition-transform">
            <i class="fas fa-microphone" id="micIcon"></i>
        </button>
    </footer>

    <div id="attachMenu">
        <div class="grid grid-cols-3 gap-6">
            <label for="cameraInput" onclick="toggleAttachMenu()" class="flex flex-col items-center gap-2 cursor-pointer active:scale-95 transition-transform">
                <div class="w-14 h-14 bg-gradient-to-tr from-pink-500 to-rose-400 rounded-full flex items-center justify-center text-white text-xl shadow-lg"><i class="fas fa-camera"></i></div>
                <span class="text-[10px] font-bold text-gray-600">Camera</span>
            </label>
            <label for="galleryInput" onclick="toggleAttachMenu()" class="flex flex-col items-center gap-2 cursor-pointer active:scale-95 transition-transform">
                <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-indigo-400 rounded-full flex items-center justify-center text-white text-xl shadow-lg"><i class="fas fa-image"></i></div>
                <span class="text-[10px] font-bold text-gray-600">Gallery</span>
            </label>
            <label class="flex flex-col items-center gap-2 cursor-pointer active:scale-95 transition-transform">
                <div class="w-14 h-14 bg-gradient-to-tr from-gray-700 to-slate-500 rounded-full flex items-center justify-center text-white text-xl shadow-lg"><i class="fas fa-file-lines"></i></div>
                <span class="text-[10px] font-bold text-gray-600">Docs</span>
            </label>
        </div>
    </div>

    <div id="imagePreviewModal" class="fixed inset-0 bg-black z-[120000] hidden flex-col transition-opacity">
        <div class="flex items-center justify-between p-4 text-white bg-black shadow-md">
            <button onclick="closeImagePreview()" class="text-xl p-2 active:scale-90"><i class="fas fa-times"></i></button>
            <button onclick="openImageEditorFromPreview()" class="text-xl p-2 active:scale-90"><i class="fas fa-pencil-alt"></i></button>
        </div>
        
        <div class="flex-1 flex justify-center items-center p-2 relative">
            <img id="previewModalImage" src="" class="max-w-full max-h-full object-contain">
        </div>

        <div class="bg-gray-900 p-2 pb-safe flex items-end gap-2 w-full">
            <div class="flex-1 bg-gray-800 rounded-3xl flex items-center px-4 border border-gray-700">
                <textarea id="captionInput" placeholder="Add a caption..." rows="1" class="w-full bg-transparent py-3 outline-none text-white text-sm resize-none max-h-24"></textarea>
            </div>
            <button onclick="sendPreviewedImage()" class="w-11 h-11 bg-[var(--primary-btn)] text-white rounded-full flex items-center justify-center shadow-md shrink-0 active:scale-95 transition-transform">
                <i class="fas fa-paper-plane text-sm ml-0.5"></i>
            </button>
        </div>
    </div>


    <div id="imageEditorModal" class="fixed inset-0 bg-black z-[130000] hidden flex-col transition-opacity">
        <div class="flex items-center justify-between p-4 text-white bg-gray-900 shadow-md">
            <button onclick="closeImageEditor()" class="text-xl p-2 active:scale-90"><i class="fas fa-times"></i> Cancel</button>
            <span class="font-bold text-sm">Draw / Highlight</span>
            <button onclick="saveEditedImage()" class="text-xl p-2 text-green-400 active:scale-90"><i class="fas fa-check"></i> Done</button>
        </div>
        
        <div class="flex-1 relative overflow-hidden flex justify-center items-center bg-black/90">
            <canvas id="drawingCanvas" class="touch-none shadow-lg max-w-full max-h-full"></canvas>
        </div>
        
        <div class="p-5 flex justify-center gap-6 bg-gray-900 pb-safe">
            <button onclick="setDrawColor('red', this)" class="color-btn w-8 h-8 rounded-full bg-red-500 border-2 border-white transform scale-110 shadow-[0_0_10px_red]"></button>
            <button onclick="setDrawColor('#0077b9', this)" class="color-btn w-8 h-8 rounded-full bg-[#0077b9] border-2 border-transparent"></button>
            <button onclick="setDrawColor('#22c55e', this)" class="color-btn w-8 h-8 rounded-full bg-green-500 border-2 border-transparent"></button>
            <button onclick="setDrawColor('#eab308', this)" class="color-btn w-8 h-8 rounded-full bg-yellow-500 border-2 border-transparent"></button>
            <button onclick="setDrawColor('white', this)" class="color-btn w-8 h-8 rounded-full bg-white border-2 border-gray-400"></button>
        </div>
    </div>

    <div id="zoomOverlay" class="zoom-overlay" onclick="closeZoom(event)">
        <img id="zoomImage" src="">
    </div>

    <input type="file" id="galleryInput" class="hidden" accept="image/*,video/*" multiple onchange="handleGallerySelect(this)">
    <input type="file" id="cameraInput" class="hidden" accept="image/*" capture="environment" onchange="handleGallerySelect(this)">
    
    <script>
        let draftData = { texts: [], images: [], voices: [], videos: [], docs: [] };
        
        // --- SCROLL APPBAR HIDE ---
        const chatContainerBox = document.getElementById('chatArea');
        const appHeader = document.getElementById('appHeader');
        let lastScrollTop = 0;
        chatContainerBox.addEventListener('scroll', function() {
            let currentScroll = chatContainerBox.scrollTop;
            if (currentScroll > lastScrollTop && currentScroll > 15) {
                appHeader.style.transform = 'translateY(-100%)'; 
            } else {
                appHeader.style.transform = 'translateY(0)';     
            }
            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; 
        });

        function handleInput(el) {
            el.style.height = '44px'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; 
            const val = el.value.trim();
            document.getElementById('sendBtn').classList.toggle('hidden', val === "");
            document.getElementById('voiceBtn').classList.toggle('hidden', val !== "");
        }

        function toggleAttachMenu() {
            document.getElementById('attachMenu').classList.toggle('active');
            document.getElementById('plusIcon').classList.toggle('rotate-45');
            document.getElementById('plusIcon').classList.toggle('text-[var(--primary-btn)]');
        }

        // Close attach menu on outside click
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('attachMenu');
            const plusBtn = document.getElementById('plusBtn');
            if (menu && menu.classList.contains('active')) {
                if (!menu.contains(event.target) && !plusBtn.contains(event.target)) {
                    toggleAttachMenu(); 
                }
            }
        });

        // ==========================================
        // 🖼️ CAPTION / PREVIEW LOGIC
        // ==========================================
        let pendingImageFile = null;
        let pendingImageUrl = null;

        function handleGallerySelect(input) {
            if(!input.files || input.files.length === 0) return;
            const file = input.files[0];
            
            if(file.type.startsWith('image/')) {
                pendingImageFile = file;
                pendingImageUrl = URL.createObjectURL(file);
                
                // Show in modal
                document.getElementById('previewModalImage').src = pendingImageUrl;
                document.getElementById('captionInput').value = "";
                
                document.getElementById('imagePreviewModal').classList.remove('hidden');
                document.getElementById('imagePreviewModal').classList.add('flex');
            }
            input.value = ""; 
        }

        function closeImagePreview() {
            document.getElementById('imagePreviewModal').classList.add('hidden');
            document.getElementById('imagePreviewModal').classList.remove('flex');
            pendingImageFile = null;
            pendingImageUrl = null;
        }

        function sendPreviewedImage() {
            const captionText = document.getElementById('captionInput').value.trim();
            // Send to draft with caption
            addToDraft('image', { file: pendingImageFile, caption: captionText });
            closeImagePreview();
        }

        // ==========================================
        // 🗑️ LONG PRESS TO SELECT & DELETE LOGIC
        // ==========================================
        let holdTimer;
        let selectedBubbleIds = new Set();
        let isSelectionMode = false;

        function startHold(e, bubbleId) {
            if(isSelectionMode) return; 
            holdTimer = setTimeout(() => {
                enterSelectionMode(bubbleId);
            }, 600); // 600ms long press par delete menu aayega
        }

        function clearHold() {
            if(holdTimer) clearTimeout(holdTimer);
        }

        function enterSelectionMode(bubbleId) {
            isSelectionMode = true;
            document.getElementById('appHeader').classList.add('hidden');
            document.getElementById('selectionHeader').classList.remove('hidden');
            document.getElementById('selectionHeader').classList.add('flex');
            toggleSelection(bubbleId);
        }

        function handleBubbleClick(bubbleId, type, itemData) {
            if (isSelectionMode) {
                // Agar delete mode on hai to select/deselect hoga
                toggleSelection(bubbleId);
            } else {
                // Agar normal mode hai
                if(type === 'image') {
                    openZoom(itemData.file); // Tap karne pe full screen
                } else if(type === 'text') {
                    editBubbleText(bubbleId); // Tap karne pe text edit
                }
            }
        }

        function toggleSelection(bubbleId) {
            const el = document.getElementById(bubbleId);
            if(selectedBubbleIds.has(bubbleId)) {
                selectedBubbleIds.delete(bubbleId);
                el.classList.remove('bubble-selected');
            } else {
                selectedBubbleIds.add(bubbleId);
                el.classList.add('bubble-selected');
            }
            
            document.getElementById('selectionCount').innerText = selectedBubbleIds.size;
            if(selectedBubbleIds.size === 0) clearSelection();
        }

        function clearSelection() {
            isSelectionMode = false;
            selectedBubbleIds.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.remove('bubble-selected');
            });
            selectedBubbleIds.clear();
            
            document.getElementById('selectionHeader').classList.add('hidden');
            document.getElementById('selectionHeader').classList.remove('flex');
            document.getElementById('appHeader').classList.remove('hidden');
        }

        function deleteSelectedItems() {
            selectedBubbleIds.forEach(bId => {
                const element = document.getElementById(bId);
                if(element) {
                    const type = element.getAttribute('data-type');
                    element.remove(); // Screen se gayab
                    
                    const key = type === 'text' ? 'texts' : type + 's';
                    draftData[key] = draftData[key].filter(item => item.id !== bId);
                }
            });
            
            clearSelection();
            
            const allItemsCount = Object.values(draftData).flat().length;
            if (allItemsCount === 0) {
                document.getElementById('emptyPlaceholder').style.display = 'flex';
                document.getElementById('confirmBtnRow').classList.add('hidden');
            }
        }

        // ==========================================
        // 🔍 ZOOM IN / ZOOM OUT LOGIC
        // ==========================================
        const zoomOverlay = document.getElementById('zoomOverlay');
        const zoomImage = document.getElementById('zoomImage');
        let currentScale = 1;

        function openZoom(fileObj) {
            const url = URL.createObjectURL(fileObj);
            zoomImage.src = url;
            zoomOverlay.classList.add('active');
            currentScale = 1;
            zoomImage.style.transform = `scale(${currentScale})`;
        }

        // Bahar click karne pe zoom band hoga
        function closeZoom(e) {
            if(e.target === zoomOverlay) {
                zoomOverlay.classList.remove('active');
                zoomImage.src = '';
            }
        }

        // Pinch to zoom mathematics
        let initialDistance = 0;
        zoomOverlay.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        zoomOverlay.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let currentDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                let scaleChange = currentDistance / initialDistance;
                currentScale = Math.min(Math.max(1, currentScale * scaleChange), 3); // Max 3x zoom
                
                zoomImage.style.transform = `scale(${currentScale})`;
                initialDistance = currentDistance;
            }
        }, { passive: false });

        // ==========================================
        // ADD TO DRAFT LOGIC
        // ==========================================
        function addToDraft(type, content) {
            document.getElementById('emptyPlaceholder').style.display = 'none';
            const chat = document.getElementById('chatArea');
            const bId = "b-" + Date.now() + "-" + Math.random().toString(36).substr(2, 5);
            const b = document.createElement('div');
            
            b.className = "bubble customer-bubble animate-pop"; 
            b.id = bId;
            b.setAttribute('data-type', type); 

            let itemData = content;
            
            if (type === 'text') {
                const val = (typeof content === 'string') ? content : document.getElementById('orderInput').value.trim();
                if(!val) return; itemData = val; 
                b.innerHTML = `<div class="pr-2"><p class="whitespace-pre-wrap">${val}</p></div>`;
                if(typeof content !== 'string') { 
                    document.getElementById('orderInput').value = ""; 
                    handleInput(document.getElementById('orderInput')); 
                }
            } 
            else if (type === 'image') {
                const imgUrl = URL.createObjectURL(content.file);
                b.innerHTML = `
                    <div class="flex flex-col">
                        <img id="img-${bId}" src="${imgUrl}" class="media-thumb">
                        ${content.caption ? `<div class="caption-text font-semibold">${content.caption}</div>` : ''}
                    </div>`;
            }

            // Events attach karna (Long Press & Click ke liye)
            b.addEventListener('touchstart', (e) => startHold(e, bId));
            b.addEventListener('touchend', clearHold);
            b.addEventListener('touchmove', clearHold);
            b.addEventListener('mousedown', (e) => startHold(e, bId));
            b.addEventListener('mouseup', clearHold);
            b.addEventListener('mouseleave', clearHold);
            
            // Browser ka apna right-click menu band karna
            b.addEventListener('contextmenu', e => { e.preventDefault(); });

            b.addEventListener('click', (e) => handleBubbleClick(bId, type, itemData));

            const key = type === 'text' ? 'texts' : type + 's';
            draftData[key].push({ id: bId, data: itemData });
            chat.appendChild(b); chat.scrollTop = chat.scrollHeight;
            
            document.getElementById('confirmBtnRow').classList.remove('hidden');
            simulateAIResponse(); // Trigger AI
        }

        // ==========================================
        // ✍️ TEXT EDIT LOGIC
        // ==========================================
        function editBubbleText(bId) {
            let textObj = draftData.texts.find(item => item.id === bId);
            if(!textObj) return;

            const input = document.getElementById('orderInput');
            input.value = textObj.data;
            handleInput(input);
            input.focus(); 

            // Delete old one
            document.getElementById(bId).remove();
            draftData.texts = draftData.texts.filter(item => item.id !== bId);
        }

        // ==========================================
        // 🎨 IMAGE DRAWING LOGIC 
        // ==========================================
        let drawCanvas = document.getElementById('drawingCanvas');
        let ctx = drawCanvas.getContext('2d');
        let isDrawing = false;
        let currentEditingBubbleId = null;
        let originalImg = new Image(); 

        function openImageEditorFromPreview() {
            document.getElementById('imagePreviewModal').classList.add('hidden');
            openImageEditor('pending', pendingImageUrl);
        }

        function openImageEditor(bubbleId, imgSrc) {
            currentEditingBubbleId = bubbleId;
            const modal = document.getElementById('imageEditorModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            originalImg.onload = function() {
                let maxWidth = window.innerWidth;
                let maxHeight = window.innerHeight - 140; 
                let ratio = Math.min(maxWidth / originalImg.width, maxHeight / originalImg.height);

                drawCanvas.width = originalImg.width * ratio;
                drawCanvas.height = originalImg.height * ratio;

                ctx.drawImage(originalImg, 0, 0, drawCanvas.width, drawCanvas.height);
                
                ctx.strokeStyle = "#0077b9"; 
                ctx.lineWidth = 4;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
            }
            originalImg.src = imgSrc;
        }

        function closeImageEditor() {
            document.getElementById('imageEditorModal').classList.add('hidden');
            document.getElementById('imageEditorModal').classList.remove('flex');
            if(currentEditingBubbleId === 'pending') {
                 document.getElementById('imagePreviewModal').classList.remove('hidden');
                 document.getElementById('imagePreviewModal').classList.add('flex');
            }
        }

        function setDrawColor(color, btnElement) {
            ctx.strokeStyle = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('transform', 'scale-110', 'border-white', 'shadow-[0_0_10px_red]');
                btn.classList.add('border-transparent');
            });
            btnElement.classList.add('transform', 'scale-110', 'border-white');
            if(color === 'red') btnElement.classList.add('shadow-[0_0_10px_red]');
        }

        function getDrawPos(e) {
            let rect = drawCanvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            e.preventDefault(); isDrawing = true;
            let pos = getDrawPos(e);
            ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
        }

        function drawPath(e) {
            if (!isDrawing) return;
            e.preventDefault();
            let pos = getDrawPos(e);
            ctx.lineTo(pos.x, pos.y); ctx.stroke();
        }

        function stopDrawing() { isDrawing = false; }

        drawCanvas.addEventListener('mousedown', startDrawing);
        drawCanvas.addEventListener('mousemove', drawPath);
        drawCanvas.addEventListener('mouseup', stopDrawing);
        drawCanvas.addEventListener('touchstart', startDrawing, {passive: false});
        drawCanvas.addEventListener('touchmove', drawPath, {passive: false});
        drawCanvas.addEventListener('touchend', stopDrawing);

        function saveEditedImage() {
            let editedDataUrl = drawCanvas.toDataURL("image/png");
            
            if (currentEditingBubbleId === 'pending') {
                pendingImageUrl = editedDataUrl;
                document.getElementById('previewModalImage').src = pendingImageUrl;
                fetch(editedDataUrl).then(res => res.blob()).then(blob => {
                    pendingImageFile = new File([blob], "edited_image.png", {type: "image/png"});
                });
                closeImageEditor();
                return;
            }

            let imgEl = document.getElementById(`img-${currentEditingBubbleId}`);
            if(imgEl) { imgEl.src = editedDataUrl; }

            fetch(editedDataUrl)
                .then(res => res.blob())
                .then(blob => {
                    let newFile = new File([blob], "edited_image.png", {type: "image/png"});
                    let imgObj = draftData.images.find(item => item.id === currentEditingBubbleId);
                    if(imgObj) { imgObj.data.file = newFile; }
                });

            closeImageEditor();
        }
        // ==========================================
        // 🎙️ VOICE RECORDING LOGIC
        // ==========================================
        let isRecording = false;
        const voiceBtn = document.getElementById('voiceBtn');
        const recordingBadge = document.getElementById('recordingBadge');
        let recordStartTime;

        function startRecording(e) {
            e.preventDefault();
            isRecording = true;
            recordingBadge.classList.remove('hidden');
            voiceBtn.classList.replace('bg-green-500', 'bg-red-500'); // Button red hoga
            recordStartTime = Date.now();
            if(navigator.vibrate) navigator.vibrate(50); // Halka vibrate
        }

        function stopRecording(e) {
            e.preventDefault();
            if (!isRecording) return;
            isRecording = false;
            recordingBadge.classList.add('hidden');
            voiceBtn.classList.replace('bg-red-500', 'bg-green-500'); // Button wapis green
            
            // Check kitni der record hua, fake audio bubble add karne ke liye
            let duration = Math.round((Date.now() - recordStartTime) / 1000);
            if(duration > 0) {
                addToDraft('text', `🎵 Voice Note (0:0${duration}s)`); 
            }
        }

        // Mouse aur Touch dono ke events
        voiceBtn.addEventListener('mousedown', startRecording);
        voiceBtn.addEventListener('touchstart', startRecording, {passive: false});
        voiceBtn.addEventListener('mouseup', stopRecording);
        voiceBtn.addEventListener('touchend', stopRecording);
        voiceBtn.addEventListener('mouseleave', stopRecording);

        // ==========================================
        // 🤖 AI RESPONSE SIMULATION LOGIC
        // ==========================================
        function simulateAIResponse() {
            const chat = document.getElementById('chatArea');
            
            // "AI is typing..." indicator show karein
            const typingId = "ai-typing-" + Date.now();
            const typingBubble = document.createElement('div');
            typingBubble.className = "bubble ai-bubble animate-pop text-gray-500 italic text-xs";
            typingBubble.id = typingId;
            typingBubble.innerHTML = "AI is typing...";
            chat.appendChild(typingBubble);
            chat.scrollTop = chat.scrollHeight;

            // 1.5 seconds baad typing indicator hide aur message show
            setTimeout(() => {
                const typingElement = document.getElementById(typingId);
                if(typingElement) typingElement.remove();
                
                const b = document.createElement('div');
                b.className = "bubble ai-bubble animate-pop"; 
                b.innerHTML = `<div class="pr-2 text-gray-800 font-medium"><p>Got it! I've noted down your details. Please click "Confirm order" when you are ready.</p></div>`;
                chat.appendChild(b); 
                chat.scrollTop = chat.scrollHeight;
            }, 1500);
        }
    </script>
</body>
</html>
