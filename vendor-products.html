<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vendor Products - Faster</title>
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="vendor-products.css">
</head>
<body>
    <audio id="notifSound" src="https://pub-46c1f50284b64647914d7901e1dd5fea.r2.dev/sound_garage-cat-meow-8-fx-306184.mp3" preload="auto"></audio>
    <script src="notification-config.js"></script>

    <!-- Offline Banner -->
    <div id="offlineBanner" class="fixed top-[-50px] left-0 w-full bg-red-500 text-white text-center text-[10px] uppercase tracking-widest py-2 font-black shadow-md flex justify-center items-center gap-2 z-50">
        <i class="fas fa-wifi-slash"></i> No Internet Connection
    </div>

    <div id="sidebarOverlay" onclick="toggleMenu()"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 h-full w-[60%] max-w-[300px] bg-white z-50 shadow-2xl p-6 flex flex-col">
        <div class="flex justify-between items-center mb-8 mt-2">
            <div class="flex items-center gap-3">
                <img id="sideLogo" src="" class="w-10 h-10 brand-logo-gol hidden border-2 border-orange-500">
                <h2 class="text-xl font-black text-blue-800 tracking-tighter">Faster <span class="text-blue-500 italic">App</span></h2>
            </div>
            <i class="fas fa-times text-xl text-gray-400 cursor-pointer p-2 active:scale-90 transition-transform" onclick="toggleMenu()"></i>
        </div>
        <nav class="space-y-3 flex-1">
            <div onclick="location.href='home.html'" class="p-1 bg-blue-50 rounded-2xl cursor-pointer border border-blue-100 flex justify-between items-center group active:bg-blue-100 transition-all shadow-sm">
                <div class="flex items-center gap-3">
                    <i class="fas fa-home text-blue-500 text-lg"></i>
                    <span class="font-bold text-gray-700">Home</span>
                </div>
                <i class="fas fa-chevron-right text-[10px] text-blue-300"></i>
            </div>
            <div onclick="location.href='profile.html'" class="p-1 bg-blue-50 rounded-2xl cursor-pointer border border-blue-100 flex justify-between items-center group active:bg-blue-100 transition-all shadow-sm">
                <div class="flex items-center gap-3">
                    <i class="fas fa-user-edit text-blue-500 text-lg"></i>
                    <span class="font-bold text-gray-700">My Profile</span>
                </div>
                <i class="fas fa-chevron-right text-[10px] text-blue-300"></i>
            </div>
            <div onclick="location.href='wallet.html'" class="p-1 bg-orange-50 rounded-2xl cursor-pointer border border-orange-100 flex justify-between items-center group active:bg-orange-100 transition-all shadow-sm">
                <div class="flex items-center gap-3">
                    <i class="fas fa-wallet text-orange-500 text-lg"></i>
                    <span class="font-bold text-gray-700">My Wallet</span>
                </div>
                <i class="fas fa-chevron-right text-[10px] text-orange-300"></i>
            </div>
            <a href="csr-chat.html" class="flex items-center gap-4 p-1 hover:bg-gray-50 rounded-2xl transition font-bold text-gray-600 border border-transparent active:border-gray-200 cursor-pointer">
                <i class="fas fa-comment-dots text-green-500 text-2xl"></i>
                <span>CSR Help</span>
            </a>
        </nav>
        <button onclick="logout()" class="w-full bg-red-50 text-red-600 font-black py-2 rounded-2xl flex items-center justify-center gap-2 mt-auto uppercase tracking-widest text-xs active:bg-red-100 transition border border-red-100 shadow-sm mb-4">
            <i class="fas fa-power-off"></i> Logout Account
        </button>
    </div>

    <!-- Header -->
    <header class="px-6 py-3 flex justify-between items-center bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100">
        <div class="flex items-center gap-4">
            <i class="fas fa-bars text-2xl text-gray-800 cursor-pointer active:scale-90 transition" onclick="toggleMenu()"></i>
            <div class="relative cursor-pointer p-1 flex items-center justify-center" onclick="openNotifications()">
                <i id="notifBell" class="fas fa-bell text-2xl text-gray-500 transition-colors"></i>
                <div id="notifBadge" class="notif-badge"></div>
            </div>
        </div>
        <div class="flex flex-col items-center">
            <p id="appbarGreeting" class="text-[10px] font-black text-gray-400 uppercase tracking-widest">GOOD EVENING</p>
            <p id="vendorName" class="text-[16px] font-black text-slate-800 tracking-tight">Vendor</p>
        </div>
        <div class="flex items-center gap-3">
            <!-- Cart Icon -->
            <div class="relative cursor-pointer" onclick="openCart()">
                <i class="fas fa-shopping-cart text-2xl text-gray-700"></i>
                <span id="cartCountBadge" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold shadow-sm hidden">0</span>
            </div>
            <div class="w-12 h-12 rounded-full border-[3px] border-orange-500 p-0.5 bg-white flex items-center justify-center">
                <img id="appLogo" src="" alt="Logo" class="w-full h-full brand-logo-gol hidden">
                <div id="logoFallback" class="w-full h-full bg-orange-500 rounded-full flex items-center justify-center">
                    <span class="text-white text-xs font-bold italic">Faster</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pb-10">
        <div class="px-6 pt-4">
            <!-- Vendor Info -->
            <div class="flex items-center gap-3 mb-4">
                <div class="w-14 h-14 rounded-full bg-orange-500 flex items-center justify-center text-white text-2xl font-bold shadow-md">
                    <span id="vendorInitial">V</span>
                </div>
                <div>
                    <h1 id="vendorTitle" class="text-xl font-extrabold text-slate-800">Vendor Name</h1>
                    <p id="vendorDesc" class="text-sm text-gray-500">Loading products...</p>
                </div>
            </div>

            <!-- Products Grid -->
            <div id="productsContainer" class="grid grid-cols-2 gap-4">
                <p class="col-span-2 text-center text-gray-400 text-sm py-6">Loading products...</p>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg z-50 transition-all duration-300 opacity-0 translate-y-10 pointer-events-none">
        <span id="toastMessage">Added to cart</span>
    </div>

    <script src="vendor-products.js"></script>

    <script src="global-message-notify.js"></script>
</body>
</html>
