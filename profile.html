<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faster · My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #f9fafb 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.02);
        }
        .input-group {
            background: #ffffff;
            border: 1.5px solid #eef2f6;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }
        .input-group:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .dropdown-trigger {
            cursor: pointer;
            background: #ffffff;
            border: 1.5px solid #eef2f6;
            border-radius: 1rem;
            padding: 0.9rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dropdown-trigger:focus {
            border-color: #3b82f6;
        }
        .modal-overlay {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        .list-item {
            transition: background 0.15s;
        }
        .list-item:active {
            background: #eef2ff;
        }
    </style>
</head>
<body class="min-h-screen py-6 px-4">

    <!-- Header -->
    <div class="max-w-md mx-auto mb-6 flex items-center gap-3">
        <button onclick="window.history.back()" class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center text-gray-600 hover:bg-gray-50 transition">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="text-2xl font-black text-gray-800">My <span class="text-blue-600">Profile</span></h1>
    </div>

    <!-- Main Card -->
    <div class="max-w-md mx-auto glass-card p-6 space-y-5">

        <!-- Name -->
        <div>
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-wider ml-2">Full Name</label>
            <div class="input-group flex items-center gap-3 mt-1">
                <i class="fas fa-user text-gray-400 text-sm"></i>
                <input type="text" id="nameInput" class="w-full bg-transparent outline-none font-semibold text-gray-700 placeholder-gray-300" placeholder="Enter your full name">
            </div>
        </div>

        <!-- Phone -->
        <div>
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-wider ml-2">Phone Number</label>
            <div class="input-group flex items-center gap-3 mt-1">
                <i class="fas fa-phone text-gray-400 text-sm"></i>
                <input type="tel" id="phoneInput" class="w-full bg-transparent outline-none font-semibold text-gray-700 placeholder-gray-300" placeholder="03XX-XXXXXXX">
            </div>
        </div>

        <!-- City (Dynamic Dropdown) -->
        <div>
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-wider ml-2">City</label>
            <div id="citySelector" class="dropdown-trigger mt-1" onclick="openCityModal()">
                <span id="cityDisplay" class="font-semibold text-gray-500">Select city</span>
                <i class="fas fa-chevron-down text-gray-400 text-xs"></i>
            </div>
        </div>

        <!-- Area (Dynamic Dropdown) -->
        <div>
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-wider ml-2">Area</label>
            <div id="areaSelector" class="dropdown-trigger mt-1" onclick="openAreaModal()">
                <span id="areaDisplay" class="font-semibold text-gray-500">Select area</span>
                <i class="fas fa-chevron-down text-gray-400 text-xs"></i>
            </div>
        </div>

        <!-- Block (Optional) -->
        <div>
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-wider ml-2">Block Name <span class="text-gray-300 font-medium">(optional)</span></label>
            <div class="input-group flex items-center gap-3 mt-1">
                <i class="fas fa-map-pin text-gray-400 text-sm"></i>
                <input type="text" id="blockInput" class="w-full bg-transparent outline-none font-semibold text-gray-700 placeholder-gray-300" placeholder="e.g. A">
            </div>
        </div>

        <!-- Address -->
        <div>
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-wider ml-2">Address</label>
            <div class="input-group mt-1">
                <textarea id="addressInput" rows="3" class="w-full bg-transparent outline-none font-semibold text-gray-700 placeholder-gray-300" placeholder="House No, Street, Nearby..."></textarea>
            </div>
        </div>

        <!-- Save Button -->
        <button onclick="updateProfile()" id="saveBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 hover:from-blue-700 hover:to-blue-600 transition-all active:scale-[0.98]">
            <i class="fas fa-check-circle mr-2"></i> SAVE CHANGES
        </button>
    </div>

    <!-- City / Area Selection Modal -->
    <div id="selectionModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center modal-overlay">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[70vh] flex flex-col animate-slide-up">
            <div class="flex items-center justify-between mb-4">
                <button onclick="closeModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-times text-gray-500 text-sm"></i>
                </button>
                <h2 id="modalTitle" class="text-lg font-black text-gray-800">Select City</h2>
                <div class="w-8"></div> <!-- spacer -->
            </div>
            <div id="modalList" class="overflow-y-auto flex-1 space-y-1">
                <!-- list items will be injected -->
            </div>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient(
            "https://hkabhikizdlbavfkualt.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U"
        );

        // State
        let citiesList = [];         // array of distinct city names (active only)
        let currentAreas = [];       // areas for selected city
        let selectedCity = null;
        let selectedArea = null;

        // DOM refs
        const cityDisplay = document.getElementById('cityDisplay');
        const areaDisplay = document.getElementById('areaDisplay');
        const modal = document.getElementById('selectionModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalList = document.getElementById('modalList');
        const citySelector = document.getElementById('citySelector');
        const areaSelector = document.getElementById('areaSelector');

        // Fetch active cities & areas on load
        async function loadDeliveryData() {
            const { data, error } = await _supabase
                .from('delivery_areas')
                .select('city, area_name')
                .eq('is_active', true);

            if (error) {
                console.error("Failed to load delivery areas:", error);
                return;
            }

            // Build distinct city list
            const citySet = new Set();
            const cityAreaMap = new Map(); // city -> areas
            data.forEach(row => {
                const c = row.city.trim();
                const a = row.area_name.trim();
                citySet.add(c);
                if (!cityAreaMap.has(c)) cityAreaMap.set(c, []);
                cityAreaMap.get(c).push(a);
            });

            citiesList = Array.from(citySet).sort();
            // Store mapping for later
            window.cityAreaMap = cityAreaMap;
        }

        // Pre‑fill form from customers table
        async function loadProfile() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.replace('index.html');

            const { data: cust } = await _supabase.from('customers')
                .select('name, phone, address, city, area, block')
                .eq('email', session.user.email)
                .maybeSingle();

            if (cust) {
                document.getElementById('nameInput').value = cust.name || '';
                document.getElementById('phoneInput').value = cust.phone || '';
                document.getElementById('addressInput').value = cust.address || '';
                if (cust.city) {
                    selectedCity = cust.city;
                    cityDisplay.textContent = cust.city;
                    cityDisplay.classList.remove('text-gray-500');
                    cityDisplay.classList.add('text-gray-800');
                    // Load areas for this city
                    await refreshAreasForCity(cust.city);
                }
                if (cust.area) {
                    selectedArea = cust.area;
                    areaDisplay.textContent = cust.area;
                    areaDisplay.classList.remove('text-gray-500');
                    areaDisplay.classList.add('text-gray-800');
                }
                document.getElementById('blockInput').value = cust.block || '';
            }
        }

        // Refresh area list after city selection
        async function refreshAreasForCity(city) {
            if (!window.cityAreaMap || !window.cityAreaMap.has(city)) {
                currentAreas = [];
                return;
            }
            // Fetch active areas for this city (to be safe, but we already filtered earlier)
            const { data } = await _supabase
                .from('delivery_areas')
                .select('area_name')
                .eq('city', city)
                .eq('is_active', true);
            currentAreas = data ? data.map(r => r.area_name.trim()).sort() : [];
        }

        // --- Modal Logic ---
        function openCityModal() {
            modalTitle.textContent = 'Select City';
            modalList.innerHTML = '';
            citiesList.forEach(city => {
                const div = document.createElement('div');
                div.className = 'list-item p-3 rounded-xl font-semibold text-gray-700 hover:bg-blue-50 cursor-pointer flex justify-between items-center';
                div.textContent = city;
                if (selectedCity === city) div.classList.add('bg-blue-50', 'text-blue-600');
                div.onclick = () => selectCity(city);
                modalList.appendChild(div);
            });
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        async function selectCity(city) {
            selectedCity = city;
            cityDisplay.textContent = city;
            cityDisplay.classList.remove('text-gray-500');
            cityDisplay.classList.add('text-gray-800');

            // Reset area
            selectedArea = null;
            areaDisplay.textContent = 'Select area';
            areaDisplay.classList.add('text-gray-500');
            areaDisplay.classList.remove('text-gray-800');

            // Load areas for this city
            await refreshAreasForCity(city);
            // If only one area, auto-select it? Optional, but let's keep manual.
            closeModal();
        }

        function openAreaModal() {
            if (!selectedCity) {
                alert('Please select a city first.');
                return;
            }
            if (currentAreas.length === 0) {
                alert('No active areas found for this city.');
                return;
            }
            modalTitle.textContent = 'Select Area';
            modalList.innerHTML = '';
            currentAreas.forEach(area => {
                const div = document.createElement('div');
                div.className = 'list-item p-3 rounded-xl font-semibold text-gray-700 hover:bg-blue-50 cursor-pointer flex justify-between items-center';
                div.textContent = area;
                if (selectedArea === area) div.classList.add('bg-blue-50', 'text-blue-600');
                div.onclick = () => selectArea(area);
                modalList.appendChild(div);
            });
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function selectArea(area) {
            selectedArea = area;
            areaDisplay.textContent = area;
            areaDisplay.classList.remove('text-gray-500');
            areaDisplay.classList.add('text-gray-800');
            closeModal();
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Close modal on background click
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        // --- Save Profile ---
        async function updateProfile() {
            const name = document.getElementById('nameInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();
            const block = document.getElementById('blockInput').value.trim();

            if (!name || !phone || !address) {
                alert('Please fill all required fields.');
                return;
            }
            if (!selectedCity || !selectedArea) {
                alert('Please select your city and area.');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Updating...';
            btn.disabled = true;

            try {
                const { data: { session } } = await _supabase.auth.getSession();
                const updateData = {
                    name,
                    phone,
                    address,
                    city: selectedCity,
                    area: selectedArea,
                    block
                };

                const { error } = await _supabase
                    .from('customers')
                    .update(updateData)
                    .eq('email', session.user.email);

                if (error) throw error;

                // Update local storage
                localStorage.setItem('faster_name', name);
                localStorage.setItem('faster_phone', phone);
                localStorage.setItem('faster_address', address);
                localStorage.setItem('faster_city', selectedCity);
                localStorage.setItem('faster_area', selectedArea);
                localStorage.setItem('faster_block', block);

                alert('Profile updated successfully!');
                window.location.replace('home.html');
            } catch (err) {
                alert('Update failed: ' + err.message);
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> SAVE CHANGES';
                btn.disabled = false;
            }
        }

        // Initialization
        window.onload = async () => {
            await loadDeliveryData();
            await loadProfile();
        };
    </script>

    <!-- Animation for modal slide-up -->
    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</body>
</html>
