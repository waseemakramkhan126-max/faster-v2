<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faster - My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f9fafb; }
        .clay-card { background: #ffffff; border-radius: 2rem; box-shadow: 10px 10px 20px #e5e7eb, -10px -10px 20px #ffffff; }
        .clay-input { background: #f9fafb; box-shadow: inset 4px 4px 8px #e5e7eb, inset -4px -4px 8px #ffffff; border: 2px solid transparent; }
        .clay-btn { background: #3b82f6; box-shadow: 6px 6px 12px #93c5fd, -6px -6px 12px #ffffff; }
    </style>
</head>
<body class="p-6">

    <header class="mb-8 flex items-center gap-4">
        <i class="fas fa-arrow-left text-xl cursor-pointer" onclick="window.history.back()"></i>
        <h1 class="text-xl font-black uppercase">My <span class="text-blue-500">Profile</span></h1>
    </header>

    <div class="max-w-md mx-auto clay-card p-8">
        <div class="space-y-4">
            <label class="text-[10px] font-black text-gray-400 uppercase ml-4">Full Name</label>
            <input type="text" id="nameInput" class="w-full clay-input h-14 rounded-2xl px-5 font-bold outline-none">

            <label class="text-[10px] font-black text-gray-400 uppercase ml-4">Phone Number</label>
            <input type="tel" id="phoneInput" class="w-full clay-input h-14 rounded-2xl px-5 font-bold outline-none">

            <label class="text-[10px] font-black text-gray-400 uppercase ml-4">Area Name</label>
            <input type="text" id="areaInput" placeholder="e.g. canal garden" class="w-full clay-input h-14 rounded-2xl px-5 font-bold outline-none">

            <label class="text-[10px] font-black text-gray-400 uppercase ml-4">Block Name (Optional)</label>
            <input type="text" id="blockInput" placeholder="e.g. A" class="w-full clay-input h-14 rounded-2xl px-5 font-bold outline-none">

            <label class="text-[10px] font-black text-gray-400 uppercase ml-4">Address</label>
            <textarea id="addressInput" rows="3" class="w-full clay-input rounded-2xl px-5 py-4 font-bold outline-none"></textarea>

            <button onclick="updateProfile()" id="saveBtn" class="w-full clay-btn text-white font-black h-16 rounded-2xl mt-6">
                SAVE CHANGES
            </button>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient("https://hkabhikizdlbavfkualt.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U");

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.replace('index.html');
            
            const { data: cust } = await _supabase.from('customers')
                .select('*')
                .eq('email', session.user.email)
                .single();

            if (cust) {
                document.getElementById('nameInput').value = cust.name || "";
                document.getElementById('phoneInput').value = cust.phone || "";
                document.getElementById('addressInput').value = cust.address || "";
                document.getElementById('areaInput').value = cust.area || "";
                document.getElementById('blockInput').value = cust.block || "";
            }
        };

        async function updateProfile() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Updating...";
            
            const data = {
                name: document.getElementById('nameInput').value.trim(),
                phone: document.getElementById('phoneInput').value.trim(),
                address: document.getElementById('addressInput').value.trim(),
                area: document.getElementById('areaInput').value.trim(),
                block: document.getElementById('blockInput').value.trim()
            };

            try {
                const { data: { session } } = await _supabase.auth.getSession();
                await _supabase.from('customers').update(data).eq('email', session.user.email);

                // LOCAL STORAGE UPDATE (Zaroori step)
                localStorage.setItem('faster_name', data.name);
                localStorage.setItem('faster_address', data.address);
                localStorage.setItem('faster_area', data.area); // Ab ye 'canal garden' save karega
                localStorage.setItem('faster_block', data.block);

                alert("Profile Updated!");
                window.location.replace('home.html');
            } catch (err) {
                alert(err.message);
                btn.innerText = "SAVE CHANGES";
            }
        }
    </script>
</body>
</html>
