<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster - Smart Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .wallet-card { background: linear-gradient(135deg, #075e54 0%, #128c7e 100%); transition: all 0.5s ease; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col min-h-screen select-none">

    <header class="bg-white p-4 flex items-center shadow-sm sticky top-0 z-50">
        <i class="fas fa-arrow-left text-xl mr-4 cursor-pointer text-gray-600" onclick="history.back()"></i>
        <h1 class="font-bold text-lg text-gray-800">My Smart Wallet</h1>
    </header>

    <main class="flex-1 p-5 max-w-md mx-auto w-full">
        
        <div id="balanceCard" class="wallet-card rounded-[2.5rem] py-5 px-6 text-white shadow-2xl mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p id="balanceLabel" class="text-[10px] opacity-80 uppercase tracking-[0.2em] font-black mb-1">Net Wallet Balance</p>
                <h2 id="balanceAmount" class="text-4xl font-extrabold mb-2 tracking-tighter">Rs. 0</h2>
                <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-white/20 border border-white/30">
                    Syncing...
                </div>
                
                <div id="actionButtons" class="mt-4 flex gap-3">
                    <button id="btnTopUp" onclick="location.href='top-up.html'" class="flex-1 bg-green-600 active:bg-green-700 border border-green-500 text-white py-2 rounded-full text-[11px] font-bold uppercase tracking-widest shadow-sm transition-all">
                        <i class="fas fa-arrow-up mr-1"></i> Top-Up
                    </button>
                    <button id="btnWithdraw" onclick="location.href='withdraw.html'" class="flex-1 bg-white/20 active:bg-white/30 border border-white/30 text-white py-2 rounded-full text-[11px] font-black uppercase tracking-widest shadow-sm backdrop-blur-sm transition-all">
                        <i class="fas fa-hand-holding-usd mr-1"></i> Withdraw
                    </button>
                </div>
            </div>
            <i class="fas fa-wallet absolute -right-6 -bottom-6 text-white/10 text-[10rem] rotate-12"></i>
        </div>

        <div class="flex justify-between items-center mb-4 px-2">
            <div>
                <h3 class="font-black text-gray-800 uppercase text-xs tracking-widest">Transaction History</h3>
                <p class="text-[10px] text-gray-400 font-bold mt-0.5 italic">Click transactions for overview preview</p>
            </div>
        </div>

        <div id="transactionList" class="space-y-2.5 pb-10">
            <div class="text-center py-10 opacity-40 text-xs font-bold uppercase"><i class="fas fa-spinner fa-spin mr-1"></i> Syncing Log...</div>
        </div>
    </main>

    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-white w-full max-w-sm rounded-[2.2rem] p-6 shadow-2xl relative animate-pop max-h-[85vh] overflow-y-auto border border-gray-100">
            <button onclick="closeModal()" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-gray-100 active:bg-gray-200 text-gray-500 rounded-full transition-colors">
                <i class="fas fa-times text-xs"></i>
            </button>
            <div id="modalContent" class="space-y-4 pt-2">
                </div>
        </div>
    </div>

    <div id="appNotificationModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-6 animate-fade-in">
        <div class="bg-white w-full max-w-xs rounded-[2rem] p-5 shadow-2xl text-center animate-pop border border-slate-50">
            <div id="notificationIconContainer" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl mb-3 shadow-sm">
                </div>
            <h3 id="notificationTitle" class="font-black text-slate-800 text-sm uppercase tracking-wide">Notification</h3>
            <p id="notificationMessage" class="text-xs text-slate-500 font-bold mt-2 leading-relaxed px-1">Message details go here.</p>
            <button onclick="closeNotificationModal()" class="w-full mt-4 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors shadow-md">
                Acknowledge
            </button>
        </div>
    </div>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const userPhone = (localStorage.getItem('faster_phone') || "").trim();

        // Safe Memory Global Cache for Unified Tracking
        window.unifiedCache = [];
        window.currentGlobalBalance = 0; // Global reference tracker for live balance state

        async function loadWalletData() {
            if (!navigator.onLine || !userPhone) return;

            try {
                let currentBal = 0;

                // 1. FETCH LIVE WALLET BALANCE
                const { data: walletData } = await _supabase
                    .from('wallets')
                    .select('current_balance')
                    .eq('customer_phone', userPhone)
                    .maybeSingle(); 

                if (walletData) {
                    currentBal = parseFloat(walletData.current_balance || 0);
                }
                window.currentGlobalBalance = currentBal;

                // 2. FETCH ALL DATA SOURCES TO UNIFY
                const { data: orders } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('customer_phone', userPhone)
                    .in('status', ['completed', 'canceled', 'CANCELLED', 'cancelled']);

                const { data: topups } = await _supabase
                    .from('topup_requests')
                    .select('*')
                    .eq('customer_phone', userPhone);

                const { data: withdraws } = await _supabase
                    .from('withdraw_requests')
                    .select('*')
                    .eq('customer_phone', userPhone);

                let tempTimeline = [];

                if (orders) {
                    orders.forEach(o => tempTimeline.push({
                        ...o,
                        txType: 'order',
                        sortDate: o.updated_at || o.created_at
                    }));
                }
                if (topups) {
                    topups.forEach(t => tempTimeline.push({
                        ...t,
                        txType: 'topup',
                        sortDate: t.created_at
                    }));
                }
                if (withdraws) {
                    withdraws.forEach(w => tempTimeline.push({
                        ...w,
                        txType: 'withdraw',
                        sortDate: w.created_at
                    }));
                }

                // Sort everything unified by date descending (Latest First)
                tempTimeline.sort((a, b) => new Date(b.sortDate) - new Date(a.sortDate));
                window.unifiedCache = tempTimeline;

                if (!walletData && tempTimeline.filter(x => x.txType === 'order').length > 0) {
                    currentBal = parseFloat(tempTimeline.filter(x => x.txType === 'order')[0].balance_amount || 0);
                    window.currentGlobalBalance = currentBal;
                }

                updateBalanceUI(currentBal);
                renderUnifiedTimeline(window.unifiedCache);

            } catch (err) { 
                console.error("Data Sync Engine Error:", err);
            }
        }

        function updateBalanceUI(bal) {
            const amtEl = document.getElementById('balanceAmount');
            const badge = document.getElementById('statusBadge');
            const label = document.getElementById('balanceLabel');
            const card = document.getElementById('balanceCard');

            amtEl.innerText = `Rs. ${Math.abs(bal)}`;

            if (bal > 0) {
                badge.innerText = "Pending Payment";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-red-500/30 text-white border border-red-400/50";
                label.innerText = "You Owe Us";
                card.style.background = "linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%)";
            } else if (bal < 0) {
                badge.innerText = "Advance Balance";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-emerald-500/30 text-white border border-emerald-400/50";
                label.innerText = "Your Remaining Credit";
                card.style.background = "linear-gradient(135deg, #065f46 0%, #064e3b 100%)";
            } else {
                badge.innerText = "All Clear";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-white/10 text-white/60 border border-white/20";
                label.innerText = "Wallet Balance";
                card.style.background = "linear-gradient(135deg, #0f172a 0%, #334155 100%)";
            }
        }

        // Render Single Unified Transaction History
        function renderUnifiedTimeline(list) {
            const container = document.getElementById('transactionList');
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-center py-16 opacity-30 text-xs font-bold uppercase">No history yet</div>`;
                return;
            }

            container.innerHTML = list.map((tx, idx) => {
                let title = "";
                let subtext = "";
                let stateBadge = "";
                let borderClass = "border-l-slate-400";

                if (tx.txType === 'order') {
                    const bal = parseFloat(tx.balance_amount || 0);
                    title = `Order #${tx.id.toString().slice(-5)}`;
                    subtext = new Date(tx.sortDate).toLocaleDateString();
                    
                    // Advanced Check: Detect if order was pending but cleared via Top-up wallet sync
                    const isSettledViaTopUp = (bal > 0 && window.currentGlobalBalance <= 0) || (bal === 0 && parseFloat(tx.final_amount) < parseFloat(tx.bill_amount) && parseFloat(tx.bill_amount) > 0);

                    if (isSettledViaTopUp) {
                        stateBadge = `<span class="text-[11px] font-black text-indigo-600 flex items-center gap-1">Settled via Top-Up <i class="fas fa-check-double"></i></span>`;
                        borderClass = "border-l-indigo-500";
                    } else if (bal === 0) {
                        stateBadge = `<span class="text-[11px] font-black text-emerald-600 flex items-center gap-1">Settled <i class="fas fa-check-double"></i></span>`;
                        borderClass = "border-l-emerald-500";
                    } else {
                        stateBadge = `<span class="text-[11px] font-black ${bal > 0 ? 'text-red-600' : 'text-emerald-600'}">${bal > 0 ? 'Pending' : 'Advance'}: Rs. ${Math.abs(bal)}</span>`;
                        borderClass = bal > 0 ? "border-l-red-500" : "border-l-emerald-500";
                    }
                } 
                else if (tx.txType === 'topup') {
                    title = `Top-Up Wallet`;
                    const status = (tx.status || 'pending').toLowerCase();
                    subtext = `${new Date(tx.sortDate).toLocaleDateString()} | ${status.toUpperCase()}`;
                    
                    if (status === 'approved') {
                        // Green color for approved topup amount text + check mark icon
                        stateBadge = `<span class="text-[11px] font-black text-emerald-600 flex items-center gap-1">Rs. ${tx.amount} <i class="fas fa-check-circle"></i></span>`;
                        borderClass = "border-l-emerald-500";
                    } else if (status === 'rejected') {
                        stateBadge = `<span class="text-[11px] font-black text-red-600">Rs. ${tx.amount}</span>`;
                        borderClass = "border-l-red-500";
                    } else {
                        stateBadge = `<span class="text-[11px] font-black text-orange-600">Rs. ${tx.amount}</span>`;
                        borderClass = "border-l-orange-500";
                    }
                } 
                else if (tx.txType === 'withdraw') {
                    title = `Withdraw Funds`;
                    const status = (tx.status || 'pending').toLowerCase();
                    subtext = `${new Date(tx.sortDate).toLocaleDateString()} | ${status.toUpperCase()}`;
                    
                    // Always Red color for withdraw amount text as requested
                    stateBadge = `<span class="text-[11px] font-black text-red-600">Rs. ${tx.amount}</span>`;
                    borderClass = status === 'approved' ? "border-l-emerald-500" : status === 'cancelled' ? "border-l-red-500" : "border-l-sky-500";
                }

                return `
                    <div onclick="openPreviewModal(${idx})" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 border-l-4 ${borderClass} cursor-pointer hover:bg-gray-50 transition-all flex justify-between items-center active:scale-[0.99] animate-pop">
                        <div>
                            <h4 class="font-black text-gray-800 text-[11px] uppercase tracking-wide">${title}</h4>
                            <p class="text-[8px] text-gray-400 font-bold mt-0.5">${subtext}</p>
                        </div>
                        <div class="text-right flex items-center gap-2 text-gray-300">
                            ${stateBadge}
                            <i class="fas fa-chevron-right text-[10px]"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Full Screen Preview Modal Controller
        function openPreviewModal(index) {
            const modal = document.getElementById('previewModal');
            const content = document.getElementById('modalContent');
            const tx = window.unifiedCache[index];
            let html = "";

            if (tx.txType === 'order') {
                const bal = parseFloat(tx.balance_amount || 0);
                const itemPlusDc = (parseFloat(tx.item_price) || 0) + (parseFloat(tx.dc_amount) || 0);
                const totalPayable = parseFloat(tx.bill_amount) || 0;
                const paid = parseFloat(tx.final_amount) || 0;

                // Smart Check for dynamic notification badge variables inside overview
                const isSettledViaTopUp = (bal > 0 && window.currentGlobalBalance <= 0) || (bal === 0 && paid < totalPayable && totalPayable > 0);

                let stateHtml = "";
                let topupExplanation = "";

                if (isSettledViaTopUp) {
                    stateHtml = `<span class="text-indigo-600 font-black text-xs flex items-center gap-1">Settled via Top-Up <i class="fas fa-check-double"></i></span>`;
                    topupExplanation = `
                        <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100 mt-2">
                            <span class="text-indigo-800 font-black text-[9px] uppercase block mb-0.5">Settlement Info:</span>
                            <p class="text-indigo-900 text-[11px] font-bold leading-tight"><i class="fas fa-wallet mr-1"></i> This order was previously pending but has been successfully cleared using your wallet Top-Up balance.</p>
                        </div>
                    `;
                } else if (bal === 0) {
                    stateHtml = `<span class="text-emerald-600 font-black text-xs flex items-center gap-1">Settled <i class="fas fa-check-double"></i></span>`;
                } else if (bal > 0) {
                    stateHtml = `<span class="text-red-600 font-black text-xs">Pending Amount: Rs. ${Math.abs(bal)}</span>`;
                } else {
                    stateHtml = `<span class="text-emerald-600 font-black text-xs">Remaining Amount: Rs. ${Math.abs(bal)}</span>`;
                }

                html = `
                    <div class="text-center border-b border-slate-100 pb-3">
                        <div class="w-12 h-12 bg-slate-100 text-slate-700 rounded-full flex items-center justify-center mx-auto text-xl mb-2"><i class="fas fa-money-bill-transfer"></i></div>
                        <h3 class="font-black text-gray-800 text-sm uppercase tracking-wide">Overview</h3>
                        <p class="text-[9px] text-gray-400 font-bold mt-0.5">ID: #${tx.id}</p>
                    </div>
                    <div class="space-y-2.5 pt-2 text-xs">
                        <div class="flex justify-between border-b pb-1.5">
                            <span class="text-gray-400 font-bold">Time & date:</span>
                            <span class="font-bold text-gray-600">${new Date(tx.sortDate).toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between border-b pb-1.5">
                            <span class="text-gray-400 font-bold">Items & DC Subtotal:</span>
                            <span class="font-bold text-gray-800">Rs. ${itemPlusDc}</span>
                        </div>
                        <div class="flex justify-between border-b pb-1.5 font-black text-slate-800 text-xs">
                            <span>Total Bill Payable:</span>
                            <span>Rs. ${totalPayable}</span>
                        </div>
                        <div class="flex justify-between bg-slate-50 border border-slate-100 px-3 py-2 rounded-xl text-slate-700 font-black items-center">
                            <span class="flex items-center gap-1.5"><i class="fas fa-hand-holding-dollar text-slate-400 text-sm"></i> Paid To Rider:</span>
                            <span class="text-xs text-slate-900">Rs. ${paid}</span>
                        </div>
                        <div class="flex justify-between border-t border-slate-100 pt-2 items-center">
                            <span class="text-gray-500 font-black uppercase text-[9px]">Status:</span>
                            ${stateHtml}
                        </div>
                        ${topupExplanation}
                    </div>
                `;
            } 
            else if (tx.txType === 'topup') {
                html = `
                    <div class="text-center border-b border-slate-100 pb-3">
                        <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto text-xl mb-2"><i class="fas fa-arrow-up"></i></div>
                        <h3 class="font-black text-gray-800 text-sm uppercase tracking-wide">Overview</h3>
                    </div>
                    <div class="space-y-3 pt-2 text-xs">
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Top-Up Amount:</span>
                            <span class="font-black text-emerald-600">Rs. ${tx.amount}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Status:</span>
                            <span class="font-black uppercase ${tx.status === 'approved' ? 'text-emerald-600' : 'text-orange-500'}">${tx.status || 'pending'}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Time & date:</span>
                            <span class="font-bold text-gray-600">${new Date(tx.sortDate).toLocaleString()}</span>
                        </div>
                        <div>
                            <span class="text-gray-400 font-bold block mb-1">Reference Snapshot Detail:</span>
                            <p class="bg-slate-50 p-3 rounded-xl italic text-gray-600 text-[11px] border border-slate-100 break-words">${tx.bank_snapshot || 'Direct Deposit'}</p>
                        </div>
                    </div>
                `;
            } 
            else if (tx.txType === 'withdraw') {
                html = `
                    <div class="text-center border-b border-slate-100 pb-3">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl mb-2"><i class="fas fa-hand-holding-usd"></i></div>
                        <h3 class="font-black text-gray-800 text-sm uppercase tracking-wide">Overview</h3>
                    </div>
                    <div class="space-y-3 pt-2 text-xs">
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Withdraw Amount:</span>
                            <span class="font-black text-red-600">Rs. ${tx.amount}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Status:</span>
                            <span class="font-black uppercase ${tx.status === 'approved' ? 'text-emerald-600' : tx.status === 'cancelled' ? 'text-red-500' : 'text-sky-500'}">${tx.status || 'pending'}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Bank Name:</span>
                            <span class="font-black text-slate-800">${tx.bank_name}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Account Title:</span>
                            <span class="font-bold text-slate-700">${tx.account_title}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Account Number:</span>
                            <span class="font-bold text-slate-800 tracking-wider font-mono">${tx.account_number}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Time & date:</span>
                            <span class="font-bold text-gray-600">${new Date(tx.sortDate).toLocaleString()}</span>
                        </div>
                        ${tx.admin_reference ? `
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                            <span class="text-emerald-800 font-black text-[9px] uppercase block mb-0.5">Admin Reference Memo:</span>
                            <p class="text-emerald-900 text-[11px] font-bold"><i class="fas fa-receipt mr-1"></i> ${tx.admin_reference}</p>
                        </div>` : ''}
                        ${tx.cancel_reason ? `
                        <div class="p-3 bg-red-50 rounded-xl border border-red-100">
                            <span class="text-red-800 font-black text-[9px] uppercase block mb-0.5">Reason for Cancellation:</span>
                            <p class="text-red-900 text-[11px] font-bold"><i class="fas fa-exclamation-circle mr-1"></i> ${tx.cancel_reason}</p>
                        </div>` : ''}
                    </div>
                `;
            }

            content.innerHTML = html;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        // Custom High-End App Notification Trigger Box (No Browser Headers / No GitHub URLs)
        function triggerCustomNotification(title, message, statusType = 'info') {
            const modal = document.getElementById('appNotificationModal');
            const titleEl = document.getElementById('notificationTitle');
            const msgEl = document.getElementById('notificationMessage');
            const iconContainer = document.getElementById('notificationIconContainer');

            titleEl.innerText = title;
            msgEl.innerText = message;

            if (title.includes('Approved') || statusType === 'success') {
                iconContainer.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl mb-3 bg-emerald-100 text-emerald-600 shadow-sm";
                iconContainer.innerHTML = `<i class="fas fa-check-circle"></i>`;
            } else if (title.includes('Cancelled') || statusType === 'error') {
                iconContainer.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl mb-3 bg-red-100 text-red-600 shadow-sm";
                iconContainer.innerHTML = `<i class="fas fa-times-circle"></i>`;
            } else {
                iconContainer.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl mb-3 bg-blue-100 text-blue-600 shadow-sm";
                iconContainer.innerHTML = `<i class="fas fa-bell"></i>`;
            }

            modal.classList.remove('hidden');
        }

        function closeNotificationModal() {
            document.getElementById('appNotificationModal').classList.add('hidden');
        }

        // Realtime Pipelines Multi-Stream Sync Subscriptions
        function setupLiveSync() {
            
            // Tracker 1: WALLET ENTRY BALANCE REFRESH
            _supabase.channel('wallet-balance-tracker')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'wallets', filter: `customer_phone=eq.${userPhone}` }, () => {
                    loadWalletData(); 
                }).subscribe();

            // Tracker 2: TOP-UPS LINE PIPELINE
            _supabase.channel('topup-tracker')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'topup_requests', filter: `customer_phone=eq.${userPhone}` }, () => {
                    loadWalletData(); 
                }).subscribe();

            // Tracker 3: WITHDRAWAL APPLICATION RESPONSES
            _supabase.channel('withdraw-tracker')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'withdraw_requests', filter: `customer_phone=eq.${userPhone}` }, () => {
                    loadWalletData(); 
                }).subscribe();

            // Tracker 4: CUSTOM IN-APP ALERTS BROADCAST (Uses Premium Modal Dialog popup directly)
            _supabase.channel('customer-notifications')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `phone=eq.${userPhone}` }, (payload) => {
                    if (payload.new) {
                        triggerCustomNotification(payload.new.title, payload.new.message);
                        loadWalletData(); 
                    }
                }).subscribe();
        }

        window.onload = () => {
            loadWalletData();
            setupLiveSync(); 
        };
    </script>
</body>
</html>
