<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster - Smart Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .wallet-card { background: linear-gradient(135deg, #075e54 0%, #128c7e 100%); transition: all 0.5s ease; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col min-h-screen select-none">

    <header class="bg-white p-4 flex items-center shadow-sm sticky top-0 z-50">
        <i class="fas fa-arrow-left text-xl mr-4 cursor-pointer text-gray-600" onclick="history.back()"></i>
        <h1 class="font-bold text-lg text-gray-800">My Smart Wallet</h1>
    </header>

    <main class="flex-1 p-5 max-w-md mx-auto w-full">
        
        <div id="balanceCard" class="wallet-card rounded-[2.5rem] py-5 px-6 text-white shadow-2xl mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p id="balanceLabel" class="text-[10px] opacity-80 uppercase tracking-[0.2em] font-black mb-1">Net Wallet Balance</p>
                <h2 id="balanceAmount" class="text-4xl font-extrabold mb-2 tracking-tighter">Rs. 0</h2>
                <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-white/20 border border-white/30">
                    Syncing...
                </div>
                
                <div id="actionButtons" class="mt-4 flex gap-3">
                    <button id="btnTopUp" onclick="location.href='top-up.html'" class="flex-1 bg-green-600 active:bg-green-700 border border-green-500 text-white py-2 rounded-full text-[11px] font-bold uppercase tracking-widest shadow-sm transition-all">
                        <i class="fas fa-arrow-up mr-1"></i> Top-Up
                    </button>
                    <button id="btnWithdraw" onclick="location.href='withdraw.html'" class="flex-1 bg-white/20 active:bg-white/30 border border-white/30 text-white py-2 rounded-full text-[11px] font-black uppercase tracking-widest shadow-sm backdrop-blur-sm transition-all">
                        <i class="fas fa-hand-holding-usd mr-1"></i> Withdraw
                    </button>
                </div>
            </div>
            <i class="fas fa-wallet absolute -right-6 -bottom-6 text-white/10 text-[10rem] rotate-12"></i>
        </div>

        <div id="topupHistoryContainer" class="mb-4"></div>
        <div id="withdrawHistoryContainer" class="mb-6"></div>

        <div class="flex justify-between items-center mb-4 px-2">
            <div>
                <h3 class="font-black text-gray-800 uppercase text-xs tracking-widest">Transaction History</h3>
                <p class="text-[10px] text-gray-400 font-bold mt-0.5 italic">Click cards for receipt preview</p>
            </div>
        </div>

        <div id="transactionList" class="space-y-2.5 pb-10">
            <div class="text-center py-10 opacity-40 text-xs font-bold uppercase"><i class="fas fa-spinner fa-spin mr-1"></i> Syncing Log...</div>
        </div>
    </main>

    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-white w-full max-w-sm rounded-[2.2rem] p-6 shadow-2xl relative animate-pop max-h-[85vh] overflow-y-auto border border-gray-100">
            <button onclick="closeModal()" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-gray-100 active:bg-gray-200 text-gray-500 rounded-full transition-colors">
                <i class="fas fa-times text-xs"></i>
            </button>
            <div id="modalContent" class="space-y-4 pt-2">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const userPhone = (localStorage.getItem('faster_phone') || "").trim();

        // Safe Memory Cache Caching arrays to prevent attribute serialization breaking
        window.topupCache = [];
        window.withdrawCache = [];
        window.ordersCache = [];

        async function loadWalletData(isManualRefresh = false) {
            if (!navigator.onLine) {
                if(isManualRefresh) alert("No internet connection!");
                return;
            }
            if (!userPhone) {
                alert("Customer phone number missing! Please Login again.");
                return;
            }

            try {
                let currentBal = 0;

                // 1. FETCH LIVE WALLET BALANCE
                const { data: walletData } = await _supabase
                    .from('wallets')
                    .select('current_balance')
                    .eq('customer_phone', userPhone)
                    .maybeSingle(); 

                if (walletData) {
                    currentBal = parseFloat(walletData.current_balance || 0);
                }

                // 2. FETCH TRANSACTIONS HISTORY (Orders)
                const { data: orders } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('customer_phone', userPhone)
                    .in('status', ['completed', 'canceled', 'CANCELLED', 'cancelled'])
                    .order('updated_at', { ascending: false });

                window.ordersCache = orders || [];
                if (!walletData && window.ordersCache.length > 0) {
                    currentBal = parseFloat(window.ordersCache[0].balance_amount || 0);
                }

                // UI Balance Sync
                updateBalanceUI(currentBal);
                renderTransactions(window.ordersCache);

                // 3. FETCH TOP-UP LOGS
                const { data: topupLogs } = await _supabase
                    .from('topup_requests')
                    .select('*')
                    .eq('customer_phone', userPhone)
                    .order('created_at', { ascending: false });

                window.topupCache = topupLogs || [];
                renderTopupLogs(window.topupCache);

                // 4. FETCH WITHDRAW LOGS (Fixed & Enabled)
                const { data: withdrawLogs } = await _supabase
                    .from('withdraw_requests')
                    .select('*')
                    .eq('customer_phone', userPhone)
                    .order('created_at', { ascending: false });

                window.withdrawCache = withdrawLogs || [];
                renderWithdrawLogs(window.withdrawCache);

            } catch (err) { 
                console.error("Unexpected Error:", err);
            }
        }

        function updateBalanceUI(bal) {
            const amtEl = document.getElementById('balanceAmount');
            const badge = document.getElementById('statusBadge');
            const label = document.getElementById('balanceLabel');
            const card = document.getElementById('balanceCard');

            amtEl.innerText = `Rs. ${Math.abs(bal)}`;

            if (bal > 0) {
                badge.innerText = "Pending Payment";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-red-500/30 text-white border border-red-400/50";
                label.innerText = "You Owe Us";
                card.style.background = "linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%)";
            } else if (bal < 0) {
                badge.innerText = "Advance Balance";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-emerald-500/30 text-white border border-emerald-400/50";
                label.innerText = "Your Remaining Credit";
                card.style.background = "linear-gradient(135deg, #065f46 0%, #064e3b 100%)";
            } else {
                badge.innerText = "All Clear";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-white/10 text-white/60 border border-white/20";
                label.innerText = "Wallet Balance";
                card.style.background = "linear-gradient(135deg, #0f172a 0%, #334155 100%)";
            }
        }

        // Compact Render Functions
        function renderTopupLogs(logs) {
            const container = document.getElementById('topupHistoryContainer');
            if (!logs || logs.length === 0) { container.innerHTML = ""; return; }

            let html = `<h3 class="font-black text-gray-800 uppercase text-xs tracking-widest mb-3 px-2">Top-up Logs</h3>`;
            logs.forEach((log, index) => {
                const currentStatus = (log.status || 'pending').toLowerCase();
                let borderColor = 'border-orange-500';
                let iconClass = 'fa-clock text-orange-500';
                if (currentStatus === 'approved') { borderColor = 'border-emerald-500'; iconClass = 'fa-check-circle text-emerald-500'; }
                else if (currentStatus === 'rejected') { borderColor = 'border-red-500'; iconClass = 'fa-times-circle text-red-500'; }

                html += `
                    <div onclick="openPreviewModal('topup', ${index})" class="bg-white p-3 rounded-xl mb-2 shadow-sm border-l-4 ${borderColor} cursor-pointer hover:bg-gray-50 transition-all flex justify-between items-center active:scale-[0.99] animate-pop">
                        <div>
                            <p class="text-[11px] font-black text-gray-800 uppercase">Top-up: Rs. ${log.amount}</p>
                            <p class="text-[8px] text-gray-400 font-bold mt-0.5">${new Date(log.created_at).toLocaleDateString()} | <span class="${currentStatus === 'approved' ? 'text-emerald-500' : ''}">${currentStatus.toUpperCase()}</span></p>
                        </div>
                        <div class="flex items-center gap-2 text-gray-300 text-xs">
                            <i class="fas ${iconClass} text-sm"></i>
                            <i class="fas fa-chevron-right text-[10px]"></i>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderWithdrawLogs(logs) {
            const container = document.getElementById('withdrawHistoryContainer');
            if (!logs || logs.length === 0) { container.innerHTML = ""; return; }

            let html = `<h3 class="font-black text-gray-800 uppercase text-xs tracking-widest mb-3 px-2">Withdrawal Logs</h3>`;
            logs.forEach((log, index) => {
                const currentStatus = (log.status || 'pending').toLowerCase();
                let borderColor = 'border-sky-500';
                let iconClass = 'fa-clock text-sky-500';
                let bgClass = 'bg-sky-50/40';
                if (currentStatus === 'approved') { borderColor = 'border-emerald-500'; iconClass = 'fa-check-circle text-emerald-500'; bgClass = 'bg-white'; }
                else if (currentStatus === 'rejected' || currentStatus === 'cancelled') { borderColor = 'border-red-500'; iconClass = 'fa-times-circle text-red-500'; bgClass = 'bg-red-50/40'; }

                html += `
                    <div onclick="openPreviewModal('withdraw', ${index})" class="${bgClass} p-3 rounded-xl mb-2 shadow-sm border-l-4 ${borderColor} cursor-pointer hover:bg-gray-50 transition-all flex justify-between items-center active:scale-[0.99] animate-pop">
                        <div>
                            <p class="text-[11px] font-black text-gray-800 uppercase">Withdraw: Rs. ${log.amount}</p>
                            <p class="text-[8px] text-gray-400 font-bold mt-0.5">${new Date(log.created_at).toLocaleDateString()} | <span>${currentStatus.toUpperCase()}</span></p>
                        </div>
                        <div class="flex items-center gap-2 text-gray-300 text-xs">
                            <i class="fas ${iconClass} text-sm"></i>
                            <i class="fas fa-chevron-right text-[10px]"></i>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderTransactions(orders) {
            const list = document.getElementById('transactionList');
            if (orders.length === 0) {
                list.innerHTML = `<div class="text-center py-16 opacity-30 text-xs font-bold uppercase">No history yet</div>`;
                return;
            }

            list.innerHTML = orders.map((o, index) => {
                const bal = parseFloat(o.balance_amount || 0);
                return `
                    <div onclick="openPreviewModal('order', ${index})" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 border-l-4 ${bal > 0 ? 'border-l-red-500' : 'border-l-emerald-500'} cursor-pointer hover:bg-gray-50 transition-all flex justify-between items-center active:scale-[0.99] animate-pop">
                        <div>
                            <h4 class="font-black text-gray-800 text-[11px] uppercase">Order #${o.id.toString().slice(-5)}</h4>
                            <p class="text-[8px] text-gray-400 font-bold mt-0.5">${new Date(o.updated_at).toLocaleDateString()}</p>
                        </div>
                        <div class="text-right flex items-center gap-2 text-gray-300">
                            <span class="text-[11px] font-black ${bal > 0 ? 'text-red-600' : 'text-emerald-600'}">
                                ${bal > 0 ? 'Pending' : 'Advance'}: Rs. ${Math.abs(bal)}
                            </span>
                            <i class="fas fa-chevron-right text-[10px]"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Full Screen Preview Modal Controller
        function openPreviewModal(type, index) {
            const modal = document.getElementById('previewModal');
            const content = document.getElementById('modalContent');
            let htmlContent = "";

            if (type === 'topup') {
                const log = window.topupCache[index];
                htmlContent = `
                    <div class="text-center border-b border-slate-100 pb-3">
                        <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto text-xl mb-2"><i class="fas fa-arrow-up"></i></div>
                        <h3 class="font-black text-gray-800 text-sm uppercase">Top-Up Invoice</h3>
                    </div>
                    <div class="space-y-3 pt-2 text-xs">
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Requested Amount:</span>
                            <span class="font-black text-slate-800">Rs. ${log.amount}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Status:</span>
                            <span class="font-black uppercase ${log.status === 'approved' ? 'text-emerald-600' : 'text-orange-500'}">${log.status || 'pending'}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Submission Date:</span>
                            <span class="font-bold text-gray-600">${new Date(log.created_at).toLocaleString()}</span>
                        </div>
                        <div>
                            <span class="text-gray-400 font-bold block mb-1">Transaction Proof / Snapshot:</span>
                            <p class="bg-slate-50 p-3 rounded-xl italic text-gray-600 text-[11px] border border-slate-100 break-words">${log.bank_snapshot || 'Direct Deposit / Standard Reference'}</p>
                        </div>
                    </div>
                `;
            } else if (type === 'withdraw') {
                const log = window.withdrawCache[index];
                htmlContent = `
                    <div class="text-center border-b border-slate-100 pb-3">
                        <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto text-xl mb-2"><i class="fas fa-hand-holding-usd"></i></div>
                        <h3 class="font-black text-gray-800 text-sm uppercase">Withdraw Details</h3>
                    </div>
                    <div class="space-y-3 pt-2 text-xs">
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Payout Amount:</span>
                            <span class="font-black text-blue-600">Rs. ${log.amount}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Status:</span>
                            <span class="font-black uppercase ${log.status === 'approved' ? 'text-emerald-600' : log.status === 'cancelled' ? 'text-red-500' : 'text-sky-500'}">${log.status || 'pending'}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Destination Bank:</span>
                            <span class="font-black text-slate-800">${log.bank_name}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Account Title:</span>
                            <span class="font-bold text-slate-700">${log.account_title}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Account Number:</span>
                            <span class="font-bold text-slate-800 tracking-wider font-mono">${log.account_number}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="text-gray-400 font-bold">Requested At:</span>
                            <span class="font-bold text-gray-600">${new Date(log.created_at).toLocaleString()}</span>
                        </div>
                        ${log.admin_reference ? `
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                            <span class="text-emerald-800 font-black text-[9px] uppercase block mb-0.5">Admin Confirmation Memo:</span>
                            <p class="text-emerald-900 text-[11px] font-bold"><i class="fas fa-receipt mr-1"></i> ${log.admin_reference}</p>
                        </div>` : ''}
                        ${log.cancel_reason ? `
                        <div class="p-3 bg-red-50 rounded-xl border border-red-100">
                            <span class="text-red-800 font-black text-[9px] uppercase block mb-0.5">Cancellation Reason:</span>
                            <p class="text-red-900 text-[11px] font-bold"><i class="fas fa-exclamation-circle mr-1"></i> ${log.cancel_reason}</p>
                        </div>` : ''}
                    </div>
                `;
            } else if (type === 'order') {
                const o = window.ordersCache[index];
                const bal = parseFloat(o.balance_amount || 0);
                const itemPlusDc = (parseFloat(o.item_price) || 0) + (parseFloat(o.dc_amount) || 0);
                const totalPayable = parseFloat(o.bill_amount) || 0;
                const paid = parseFloat(o.final_amount) || 0;
                const prevHist = totalPayable - itemPlusDc;

                htmlContent = `
                    <div class="text-center border-b border-slate-100 pb-3">
                        <div class="w-12 h-12 bg-slate-100 text-slate-700 rounded-full flex items-center justify-center mx-auto text-xl mb-2"><i class="fas fa-shopping-bag"></i></div>
                        <h3 class="font-black text-gray-800 text-sm uppercase">Order Receipt Breakdown</h3>
                        <p class="text-[9px] text-gray-400 font-bold mt-0.5">Order Token: #${o.id}</p>
                    </div>
                    <div class="space-y-2.5 pt-2 text-xs">
                        <div class="flex justify-between border-b pb-1.5">
                            <span class="text-gray-400 font-bold">Settlement Timestamp:</span>
                            <span class="font-bold text-gray-600">${new Date(o.updated_at).toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between border-b pb-1.5">
                            <span class="text-gray-400 font-bold">Current Order (Item+DC):</span>
                            <span class="font-bold text-gray-800">Rs. ${itemPlusDc}</span>
                        </div>
                        ${prevHist !== 0 ? `
                        <div class="flex justify-between border-b pb-1.5 ${prevHist > 0 ? 'text-red-500' : 'text-emerald-600'}">
                            <span class="font-bold">Prev. ${prevHist > 0 ? 'Outstanding Bill' : 'Advance Credits'}:</span>
                            <span class="font-bold">${prevHist > 0 ? '+' : ''}Rs. ${prevHist}</span>
                        </div>` : ''}
                        <div class="flex justify-between border-b pb-1.5 font-black text-slate-800 text-xs">
                            <span>Gross Bill Payable:</span>
                            <span>Rs. ${totalPayable}</span>
                        </div>
                        <div class="flex justify-between bg-blue-50 px-3 py-2 rounded-xl text-blue-700 font-black items-center">
                            <span>Handed over to Rider:</span>
                            <span class="text-xs">Rs. ${paid}</span>
                        </div>
                        <div class="flex justify-between border-t border-slate-100 pt-2 items-center">
                            <span class="text-gray-500 font-black uppercase text-[9px]">Resulting State:</span>
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${bal > 0 ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                                ${bal > 0 ? 'You Owe' : 'In Advance'}: Rs. ${Math.abs(bal)}
                            </span>
                        </div>
                    </div>
                `;
            }

            content.innerHTML = htmlContent;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        // Production Level 4-in-1 Realtime Synced Pipeline Listener
        function setupLiveSync() {
            
            // Tracker 1: WALLET BALANCE (Fix: Runs loadWalletData if balance turns Rs 300 or updates)
            _supabase.channel('wallet-balance-tracker')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'wallets', filter: `customer_phone=eq.${userPhone}` }, () => {
                    loadWalletData(); 
                }).subscribe();

            // Tracker 2: TOP-UP REQUESTS
            _supabase.channel('topup-tracker')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'topup_requests', filter: `customer_phone=eq.${userPhone}` }, () => {
                    loadWalletData(); 
                }).subscribe();

            // Tracker 3: WITHDRAW REQUESTS
            _supabase.channel('withdraw-tracker')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'withdraw_requests', filter: `customer_phone=eq.${userPhone}` }, () => {
                    loadWalletData(); 
                }).subscribe();

            // Tracker 4: LIVE NOTIFICATIONS POPUPS
            _supabase.channel('customer-notifications')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `phone=eq.${userPhone}` }, (payload) => {
                    if (payload.new) {
                        alert(`${payload.new.title}\n\n${payload.new.message}`);
                        loadWalletData(); 
                    }
                }).subscribe();
        }

        window.onload = () => {
            loadWalletData();
            setupLiveSync(); 
        };
    </script>
</body>
</html>
