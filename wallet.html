<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster - Smart Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .wallet-card { background: linear-gradient(135deg, #075e54 0%, #128c7e 100%); transition: all 0.5s ease; }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .tx-card { border-left: 4px solid transparent; }
        .tx-card.pending { border-left-color: #ef4444; background: #fffafb; }
        .tx-card.remaining { border-left-color: #10b981; background: #fafffb; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white p-4 flex items-center shadow-sm sticky top-0 z-50">
        <i class="fas fa-arrow-left text-xl mr-4 cursor-pointer text-gray-600" onclick="history.back()"></i>
        <h1 class="font-bold text-lg text-gray-800">My Smart Wallet</h1>
    </header>

    <main class="flex-1 p-5 max-w-md mx-auto w-full"> 
        <div id="actionButtons" class="mt-4 flex gap-3">
    <button id="btnTopUp" onclick="location.href='top-up.html'" class="flex-1 bg-green-600 active:bg-green-700 border border-green-500 text-white py-2 rounded-full text-[11px] font-bold uppercase tracking-widest shadow-sm transition-colors">
        <i class="fas fa-arrow-up mr-1"></i> Top-Up
    </button>
    
    <button id="btnWithdraw" onclick="location.href='withdraw.html'" class="flex-1 bg-white/20 active:bg-white/30 border border-white/30 text-white py-2 rounded-full text-[11px] font-black uppercase tracking-widest shadow-sm backdrop-blur-sm transition-colors">
        <i class="fas fa-hand-holding-usd mr-1"></i> Withdraw
    </button>
</div>

        <div id="topupHistoryContainer" class="mb-6"></div>

        <div class="flex justify-between items-center mb-6 px-2">
            <div>
                <h3 class="font-black text-gray-800 uppercase text-xs tracking-widest">Transaction History</h3>
                <p class="text-[10px] text-gray-400 font-bold mt-1 italic">Last Order Status</p>
            </div>
        </div>

        <div id="transactionList" class="space-y-4 pb-10">
        </div>
    </main>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const userPhone = (localStorage.getItem('faster_phone') || "").trim();

        async function loadWalletData(isManualRefresh = false) {
            if (!navigator.onLine) {
                if(isManualRefresh) alert("No internet connection!");
                return;
            }

            if (!userPhone) {
                alert("Customer phone number missing! Please Login again.");
                document.getElementById('balanceAmount').innerText = "Rs. 0";
                return;
            }

            try {
                let currentBal = 0;
                let ordersList = [];

                // 1. WALLET BALANCE
                const { data: walletData, error: walErr } = await _supabase
                    .from('wallets')
                    .select('current_balance')
                    .eq('customer_phone', userPhone)
                    .maybeSingle(); 

                if (walErr) {
                    console.error("Wallets Table Error: " + walErr.message);
                } else if (walletData) {
                    currentBal = parseFloat(walletData.current_balance || 0);
                }

                // 2. TRANSACTIONS HISTORY (Orders)
                const { data: orders, error: ordErr } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('customer_phone', userPhone)
                    .in('status', ['completed', 'canceled', 'CANCELLED', 'cancelled'])
                    .order('updated_at', { ascending: false });

                if (ordErr) {
                    console.error("Orders Table Error: ", ordErr.message);
                } else {
                    ordersList = orders || [];
                    if (!walletData && ordersList.length > 0) {
                        currentBal = parseFloat(ordersList[0].balance_amount || 0);
                    }
                }

                // 3. UI UPDATE (Balance & Orders)
                updateBalanceUI(currentBal);
                if (!ordErr) renderTransactions(ordersList);

                // ---> YAHAN AAPKA TOP-UP LOGS WALA CODE ADD KIYA HAI <---
                const { data: topupLogs } = await _supabase
                    .from('topup_requests')
                    .select('*')
                    .eq('customer_phone', userPhone)
                    .order('created_at', { ascending: false });

                // ---> YAHAN SE REPLACE KAREIN <---
                if (topupLogs && topupLogs.length > 0) {
                    let topupHtml = `<h3 class="font-black text-gray-800 uppercase text-xs tracking-widest mb-4 px-2">Top-up Logs</h3>`;
                    
                    topupLogs.forEach(log => {
                        // SAKHT CHECKING: Status jaisa bhi aye usko lower case me match karega
                        const currentStatus = (log.status || 'pending').toLowerCase();
                        
                        let borderColor = 'border-orange-500';
                        let iconClass = 'fa-clock text-orange-500';
                        
                        if (currentStatus === 'approved') {
                            borderColor = 'border-emerald-500';
                            iconClass = 'fa-check-circle text-emerald-500';
                        } else if (currentStatus === 'rejected') {
                            borderColor = 'border-red-500';
                            iconClass = 'fa-times-circle text-red-500';
                        }

                        topupHtml += `
                            <div class="bg-white p-4 rounded-2xl mb-3 shadow-sm border-l-4 ${borderColor}">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="text-[10px] font-black text-gray-800 uppercase">Top-up: Rs. ${log.amount}</p>
                                        <p class="text-[8px] text-gray-400 font-bold mt-1">${new Date(log.created_at).toLocaleDateString()} | <span class="${currentStatus === 'approved' ? 'text-emerald-500' : ''}">${currentStatus.toUpperCase()}</span></p>
                                    </div>
                                    <i class="fas ${iconClass} text-lg"></i>
                                </div>
                                <p class="text-[8px] text-gray-400 mt-2 italic">${log.bank_snapshot || 'Direct Deposit'}</p>
                            </div>
                        `;
                    });
                    document.getElementById('topupHistoryContainer').innerHTML = topupHtml;
                }
                // ---> YAHAN TAK <---

            } catch (err) { 
                console.error("Unexpected Error:", err);
            }
        }

        function updateBalanceUI(bal) {
            const amtEl = document.getElementById('balanceAmount');
            const badge = document.getElementById('statusBadge');
            const label = document.getElementById('balanceLabel');
            const card = document.getElementById('balanceCard');
            
            const btnTopUp = document.getElementById('btnTopUp');
            const btnWithdraw = document.getElementById('btnWithdraw');

            if(btnTopUp) btnTopUp.classList.add('hidden');
            if(btnWithdraw) btnWithdraw.classList.add('hidden');

            amtEl.innerText = `Rs. ${Math.abs(bal)}`;

            if (bal > 0) {
                badge.innerText = "Pending Payment";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-red-500/30 text-white border border-red-400/50";
                label.innerText = "You Owe Us";
                card.style.background = "linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%)";
                if(btnTopUp) btnTopUp.classList.remove('hidden');
            } else if (bal < 0) {
                badge.innerText = "Advance Balance";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-emerald-500/30 text-white border border-emerald-400/50";
                label.innerText = "Your Remaining Credit";
                card.style.background = "linear-gradient(135deg, #065f46 0%, #064e3b 100%)";
                if(btnWithdraw) btnWithdraw.classList.remove('hidden');
            } else {
                badge.innerText = "All Clear";
                badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-white/10 text-white/60 border border-white/20";
                label.innerText = "Wallet Balance";
                card.style.background = "linear-gradient(135deg, #0f172a 0%, #334155 100%)";
                if(btnTopUp) btnTopUp.classList.remove('hidden');
            }
        }

        function renderTransactions(orders) {
            const list = document.getElementById('transactionList');
            if (orders.length === 0) {
                list.innerHTML = `<div class="text-center py-20 opacity-30 text-xs font-bold uppercase">No history yet</div>`;
                return;
            }

            list.innerHTML = orders.map(o => {
                const bal = parseFloat(o.balance_amount || 0);
                const itemPlusDc = (parseFloat(o.item_price) || 0) + (parseFloat(o.dc_amount) || 0);
                const totalPayable = parseFloat(o.bill_amount) || 0;
                const paid = parseFloat(o.final_amount) || 0;
                const prevHist = totalPayable - itemPlusDc;

                return `
                    <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 tx-card ${bal > 0 ? 'pending' : 'remaining'} animate-pop">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-black text-gray-800 text-[12px] uppercase">Order #${o.id.toString().slice(-5)}</h4>
                                <p class="text-[9px] text-gray-400 font-bold">${new Date(o.updated_at).toLocaleString()}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-black ${bal > 0 ? 'text-red-600' : 'text-emerald-600'}">
                                    ${bal > 0 ? 'Pending' : 'Advance'}: Rs. ${Math.abs(bal)}
                                </span>
                            </div>
                        </div>
                        
                        <div class="space-y-1 border-t border-dashed border-gray-100 pt-3">
                            <div class="flex justify-between text-[10px] font-bold text-gray-500">
                                <span>Current Order (Item+DC):</span>
                                <span>Rs. ${itemPlusDc}</span>
                            </div>
                            ${prevHist !== 0 ? `
                            <div class="flex justify-between text-[10px] font-bold ${prevHist > 0 ? 'text-red-400' : 'text-emerald-400'}">
                                <span>Prev. ${prevHist > 0 ? 'Pending' : 'Advance'}:</span>
                                <span>${prevHist > 0 ? '+' : ''}Rs. ${prevHist}</span>
                            </div>` : ''}
                            <div class="flex justify-between text-[11px] font-black text-gray-800 pt-1">
                                <span>Total Payable:</span>
                                <span>Rs. ${totalPayable}</span>
                            </div>
                            <div class="flex justify-between text-[11px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-lg mt-2">
                                <span>You Paid to Rider:</span>
                                <span>Rs. ${paid}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ---> AAKHRI LINE (window.onload) KO IS SE REPLACE KAREIN <---
        
        // Realtime Tracker
        function setupLiveSync() {
            _supabase.channel('topup-tracker')
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'topup_requests', 
                    filter: `customer_phone=eq.${userPhone}` 
                }, (payload) => {
                    loadWalletData(); // Bina page refresh kiye auto-update
                }).subscribe();
        }

        window.onload = () => {
            loadWalletData();
            setupLiveSync(); // Tracker on
        };
    </script>
</body>
</html>
