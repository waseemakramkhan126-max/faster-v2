<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faster - Order Chat</title>
<link rel="icon" href="favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden">

<!-- Header -->
<header class="bg-blue-600 text-white px-4 py-3 flex items-center gap-3 shadow-md shrink-0">
    <i class="fas fa-arrow-left text-xl cursor-pointer" onclick="history.back()"></i>
    <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center font-bold">R</div>
    <div class="flex-1 min-w-0">
        <div id="chatTitle" class="font-bold">Order Chat</div>
        <div id="chatSubtitle" class="text-[11px] opacity-80">Loading...</div>
    </div>
</header>

<!-- Messages -->
<div id="messagesContainer" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-white"></div>

<!-- Input -->
<footer class="bg-white p-2.5 flex items-center gap-2 border-t border-gray-200">
    <input id="msgInput" type="text" placeholder="Type a message..."
        class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 outline-none text-sm">
    <button onclick="sendMessage()" class="w-11 h-11 bg-orange-500 text-white rounded-full flex items-center justify-center active:scale-95 transition">
        <i class="fas fa-paper-plane"></i>
    </button>
</footer>

<script>
const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

const myPhone = (localStorage.getItem('faster_phone') || '').trim();
const urlParams = new URLSearchParams(location.search);
const orderId = urlParams.get('orderId');
if (!orderId) { alert('Invalid order chat'); history.back(); }

const container = document.getElementById('messagesContainer');
const input = document.getElementById('msgInput');

/* ---------- helpers ---------- */
function formatTime(ts) {
    return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function scrollBottom() { setTimeout(() => container.scrollTop = container.scrollHeight, 50); }

function renderMessage(msg) {
    const isMe = msg.sender_phone === myPhone;
    const div = document.createElement('div');
    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `
        <div class="max-w-[78%] px-3 py-2 rounded-2xl ${isMe
            ? 'bg-blue-600 text-white rounded-br-sm'
            : 'bg-gray-200 text-gray-900 rounded-bl-sm'}">
            <p class="text-sm whitespace-pre-wrap">${escapeHtml(msg.message || '')}</p>
            <div class="text-[10px] opacity-70 mt-1 text-right">${formatTime(msg.created_at)}</div>
        </div>`;
    container.appendChild(div);
}

/* ---------- header info (rider name) ---------- */
async function loadOrderInfo() {
    const { data: order } = await _supabase.from('orders').select('*').eq('id', orderId).single();
    if (!order) return;
    // ⚠️ column name verify karein: rider_id / assigned_rider_id / rider_customer_id
    const riderId = order.rider_id;
    if (riderId) {
        const { data: rider } = await _supabase.from('customers')
            .select('name, phone').eq('customer_id', riderId).maybeSingle();
        if (rider) {
            document.getElementById('chatTitle').textContent = rider.name || 'Rider';
            document.getElementById('chatSubtitle').textContent = 'Order #' + orderId;
            return;
        }
    }
    document.getElementById('chatTitle').textContent = 'Order #' + orderId;
    document.getElementById('chatSubtitle').textContent = 'Rider';
}

/* ---------- load messages ---------- */
async function loadMessages() {
    const { data, error } = await _supabase.from('order_chats')
        .select('*')
        .eq('order_id', orderId)
        .order('created_at', { ascending: true });
    if (error) { console.error(error); return; }
    container.innerHTML = '';
    (data || []).forEach(renderMessage);
    scrollBottom();
    markAsSeen(data || []);
}

async function markAsSeen(messages) {
    const ids = messages
        .filter(m => m.sender_phone !== myPhone && m.status !== 'seen')
        .map(m => m.id);
    if (!ids.length) return;
    await _supabase.from('order_chats').update({ status: 'seen' }).in('id', ids);
}

/* ---------- send ---------- */
async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const { data, error } = await _supabase.from('order_chats').insert([{
        order_id: orderId,
        sender_phone: myPhone,
        message: text,
        status: 'sent'
    }]).select().single();
    if (error) {
        console.error(error);
        alert('Message send nahi hua');
        input.value = text;
        return;
    }
    renderMessage(data);
    scrollBottom();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

/* ---------- realtime ---------- */
_supabase.channel('order-chat-' + orderId)
    .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'order_chats',
        filter: `order_id=eq.${orderId}`
    }, payload => {
        if (payload.new.sender_phone === myPhone) return;
        renderMessage(payload.new);
        scrollBottom();
        markAsSeen([payload.new]);
    })
    .subscribe();

loadOrderInfo();
loadMessages();
</script>
</body>
</html>
